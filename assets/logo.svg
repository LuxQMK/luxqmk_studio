  <!-- ==================== RZĄD 7: DOLNY RZĄD ZE SPACJĄ QMK (Y = 364) ==================== -->
  <!-- Lewy blok klawiszy -->
  <rect x="79" y="364" width="66" height="36" rx="9" fill="#11141e"/>

  <!-- Wycentrowana spacja QMK (Środek X = 256, Y = 382) -->
  <g>
    <rect x="151" y="364" width="210" height="36" rx="10" fill="#1D4ED8"/>

    <!-- Napis wektorowy QMK -->
    <g fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Q -->
      <rect x="216" y="374" width="14" height="14" rx="4"/>
      <path d="M 225,383 L 231,389"/>

      <!-- M -->
      <path d="M 241,388 V 374 L 249,382 L 257,374 V 388"/>

      <!-- K -->
      <path d="M 267,374 V 388 M 281,374 L 269,381 L 281,388"/>
    </g>
  </g>

  <!-- Prawy blok klawiszy -->
  <rect x="367" y="364" width="66" height="36" rx="9" fill="#11141e"/>
