        keyEl.className = "tester-keycap";
        keyEl.id = `test-key-${key.id}`;

        keyEl.style.left = `calc(${key.x} * var(--key-unit) + 18px)`;
        keyEl.style.top = `calc(${key.y} * var(--key-unit) + 18px)`;
        keyEl.style.width = `calc(${key.w} * var(--key-unit) - 4px)`;
        keyEl.style.height = `calc(${key.h} * var(--key-unit) - 4px)`;

        if (this.testedKeys.has(key.id)) keyEl.classList.add("tested");
        if (this.pressedKeys.has(key.id)) keyEl.classList.add("pressed");

        if (key.isLogo) {
          keyEl.innerHTML = "";
        } else if (key.isKnob) {
          keyEl.innerHTML = `<span class="t-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="3" x2="12" y2="7"></line></svg></span>`;
        } else {
          keyEl.innerHTML = `<span class="t-label">${key.label}</span>`;
        }
        container.appendChild(keyEl);
      });

      window.gUI?.fitKeyboardPreviews();
      this._updateStats();
    }

    _handleKeyDown(e) {
      if (!this.isActive) return;
      
      const keyId = this._mapCodeToKeyId(e.code);
      if (keyId) {
        this.pressedKeys.add(keyId);
        this.testedKeys.add(keyId);
        
        const el = document.getElementById(`test-key-${keyId}`);
        if (el) {
          el.classList.add("pressed");
          el.classList.add("tested");
        }
      }

      this.history.unshift({
        key: e.key,
        code: e.code,
        time: new Date().toLocaleTimeString()
      });
      if (this.history.length > 20) this.history.pop();

      this._updateStats();
    }

    _handleKeyUp(e) {
      if (!this.isActive) return;

      const keyId = this._mapCodeToKeyId(e.code);
      if (keyId) {
        this.pressedKeys.delete(keyId);
        const el = document.getElementById(`test-key-${keyId}`);
        if (el) {
          el.classList.remove("pressed");
        }

      this._updateStats();

/**
 * GMMK Studio - Backup & Restore Manager
 * Handles 100% complete configuration extraction, smart diff flashing, progress indicators & verification.
 */

(function () {
  class BackupManager {
    constructor(protocol) {
      this.protocol = protocol;
      this.stagedBackupData = null;
    }

    init() {
      this._bindBackupActions();
      this._bindRestoreActions();
      this._bindConsoleActions();
    }

    _log(msg, type = "info") {
      if (this.protocol) {
        this.protocol.log(msg, type);
      }
    }

    async createBackup(onProgress) {
      if (!this.protocol || !this.protocol.device) {
        throw new Error("Keyboard not connected!");
      }

      const { CHANNELS, CUSTOM_VAL, RGB_MATRIX_VAL, KEYBOARD_SPECS } = window.GMMK3_CONSTANTS;

      this._log("▶ Starting full keyboard memory backup...", "info");

      const backup = {
        app: "GMMK3_Studio_Companion",
        version: 2,
        keyboard_name: this.protocol.device?.productName || "GMMK 3 100% ANSI",
        created_at: new Date().toISOString(),
        layers: [],
        encoders: [],
        macros: {},
        rgb_matrix: {},
        custom_settings: {}
      };

      // 1. Read all layer keycodes (Layers 0..2)
      this._log("Reading key matrix for 3 layers (Safe Chunked Transfer)...", "info");
      try {
        const keymapBytes = await this.protocol.readFullKeymap(KEYBOARD_SPECS.layers, KEYBOARD_SPECS.rows, KEYBOARD_SPECS.cols);

        for (let layer = 0; layer < KEYBOARD_SPECS.layers; layer++) {
          const layerMatrix = [];
          for (let r = 0; r < KEYBOARD_SPECS.rows; r++) {
            const rowKeys = [];
            for (let c = 0; c < KEYBOARD_SPECS.cols; c++) {
              const byteIdx = (layer * KEYBOARD_SPECS.rows * KEYBOARD_SPECS.cols * 2) + (r * KEYBOARD_SPECS.cols * 2) + (c * 2);
              const keycode = (keymapBytes[byteIdx] << 8) | keymapBytes[byteIdx + 1];
              rowKeys.push(keycode);
            }
            layerMatrix.push(rowKeys);
          }
          backup.layers.push(layerMatrix);
          if (onProgress) onProgress(Math.round(((layer + 1) / KEYBOARD_SPECS.layers) * 40));
        }
        this._log(`Successfully read ${backup.layers.length} layers from keyboard buffer.`, "success");
      } catch (err) {
        this._log("Fallback: Reading keycodes via individual HID queries...", "warning");
        for (let layer = 0; layer < KEYBOARD_SPECS.layers; layer++) {
          const layerMatrix = [];
          for (let r = 0; r < KEYBOARD_SPECS.rows; r++) {
            const rowKeys = [];
            for (let c = 0; c < KEYBOARD_SPECS.cols; c++) {
              const keycode = await this.protocol.getKeycode(layer, r, c);
              rowKeys.push(keycode);
            }
            layerMatrix.push(rowKeys);
          }
          backup.layers.push(layerMatrix);
          if (onProgress) onProgress(Math.round(((layer + 1) / KEYBOARD_SPECS.layers) * 40));
        }
      }

      // 2. Read rotary knob encoder mappings for all layers
      this._log("Reading rotary knob configuration (CCW, CW, Press) for all layers...", "info");
      for (let layer = 0; layer < KEYBOARD_SPECS.layers; layer++) {
        const ccw = await this.protocol.getEncoder(layer, 0, false);
        const cw = await this.protocol.getEncoder(layer, 0, true);
        const press = backup.layers[layer]?.[0]?.[7] ?? 0x00A8;
        backup.encoders.push({ layer, ccw, cw, press });
      }
      if (onProgress) onProgress(55);

      // 3. Read dynamic macros
      this._log("Reading macro buffer memory...", "info");
      try {
        backup.macros = await this.protocol.getMacroBuffer();
        this._log(`Successfully read macro buffer (${backup.macros.bufferSize || 0} bytes).`, "success");
      } catch (err) {
        backup.macros = { bufferSize: 0, data: [] };
      }
      if (onProgress) onProgress(70);

      // 4. Read RGB Matrix settings
      this._log("Reading RGB Matrix lighting parameters...", "info");
      try {
        const bri = await this.protocol.getRGBMatrixValue(RGB_MATRIX_VAL.BRIGHTNESS);
        const eff = await this.protocol.getRGBMatrixValue(RGB_MATRIX_VAL.EFFECT);
        const spd = await this.protocol.getRGBMatrixValue(RGB_MATRIX_VAL.EFFECT_SPEED);
        const col = await this.protocol.getRGBMatrixValue(RGB_MATRIX_VAL.COLOR);

        backup.rgb_matrix = {
          brightness: bri ? bri[3] : 255,
          effect: eff ? eff[3] : 1,
          speed: spd ? spd[3] : 128,
          hue: col ? col[3] : 0,
          sat: col ? col[4] : 255
        };
        this._log(`Read RGB: Effect #${backup.rgb_matrix.effect}, Brightness ${backup.rgb_matrix.brightness}, Speed ${backup.rgb_matrix.speed}.`, "success");
      } catch (err) {
        this._log("RGB Matrix read warning: " + err.message, "warning");
      }
      if (onProgress) onProgress(85);

      // 5. Read LuxQMK custom settings (Debounce time, Layer lighting, Reactive, Dim, Win Lock, Logo Lock states)
      this._log("Reading LuxQMK custom settings (Debounce time, Layers, Reactive, Dimming, Logo Lock Indicators)...", "info");
      try {
        const dbTime = await this.protocol.getDebounceTime();
        const rev = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.RGB_REVERSE);
        const lEn = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LAYER_LIGHTING_ENABLE);
        const lDim = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LAYER_DIM_LEVEL);
        const l1 = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LAYER_1_COLOR);
        const l2 = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LAYER_2_COLOR);
        const l3 = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LAYER_3_COLOR);
        const logo = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LOGO_MODE);

        // Reactive Layer settings
        const rEn = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.REACTIVE_ENABLE);
        const rMode = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.REACTIVE_MODE);
        const rCol = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.REACTIVE_COLOR);
        const rSpd = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.REACTIVE_SPEED);
        const rBld = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.REACTIVE_BLEND);

        // Win Lock settings
        const wlMode = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.WIN_LOCK_MODE);
        const wlCol = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.WIN_LOCK_COLOR);

        // 7 lock indicator colors
        const caps = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LOGO_COLOR_CAPS);
        const num = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LOGO_COLOR_NUM);
        const scroll = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LOGO_COLOR_SCROLL);
        const capsNum = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LOGO_COLOR_CAPS_NUM);
        const capsScroll = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LOGO_COLOR_CAPS_SCROLL);
        const numScroll = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LOGO_COLOR_NUM_SCROLL);
        const all = await this.protocol.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LOGO_COLOR_ALL);

        const densityRes = await this.protocol.getCustomValue(CHANNELS.CUSTOM, 36);
        const effectDensity = (densityRes && densityRes[0] !== 0xFF && Number.isFinite(densityRes[3])) ? densityRes[3] : 128;

        backup.custom_settings = {
          debounce_time: dbTime !== undefined ? dbTime : 5,
          rgb_reverse: rev ? rev[3] === 1 : false,
          effect_density: effectDensity,
          layer_lighting_enable: lEn ? lEn[3] === 1 : true,
          layer_dim_level: lDim ? lDim[3] : 128,
          layer_colors: {
            layer_1: l1 ? { h: l1[3], s: l1[4] } : { h: 28, s: 255 },
            layer_2: l2 ? { h: l2[3], s: l2[4] } : { h: 128, s: 255 },
            layer_3: l3 ? { h: l3[3], s: l3[4] } : { h: 200, s: 255 }
          },
          reactive_layer: {
            enable: rEn ? rEn[3] === 1 : false,
            mode: rMode ? rMode[3] : 0,
            color: rCol ? { h: rCol[3], s: rCol[4] } : { h: 180, s: 255 },
            speed: rSpd ? rSpd[3] : 128,
            blend: rBld ? rBld[3] : 0
          },
          win_lock: {
            mode: wlMode ? wlMode[3] : 1,
            color: wlCol ? { h: wlCol[3], s: wlCol[4] } : { h: 0, s: 255 }
          },
          logo_led: {
            mode: logo ? logo[3] : 1,
            caps: caps ? { h: caps[3], s: caps[4] } : { h: 0, s: 255 },
            num: num ? { h: num[3], s: num[4] } : { h: 145, s: 255 },
            scroll: scroll ? { h: scroll[3], s: scroll[4] } : { h: 85, s: 255 },
            caps_num: capsNum ? { h: capsNum[3], s: capsNum[4] } : { h: 213, s: 255 },
            caps_scroll: capsScroll ? { h: capsScroll[3], s: capsScroll[4] } : { h: 43, s: 255 },
            num_scroll: numScroll ? { h: numScroll[3], s: numScroll[4] } : { h: 106, s: 255 },
            all: all ? { h: all[3], s: all[4] } : { h: 0, s: 0 }
          }
        };

        // Hardware Multi-Stop Gradient Settings
        try {
          let activeGrad = 0;
          const gradRes = await this.protocol.getCustomValue(CHANNELS.CUSTOM, 33);
          if (gradRes && gradRes[0] !== 0xFF && Number.isFinite(gradRes[3])) {
            activeGrad = gradRes[3];
          }

          const customGradProfiles = [];
          for (let p = 0; p < 2; p++) {
            const countRes = await this.protocol.getCustomValue(CHANNELS.CUSTOM, 34, p);
            if (countRes && countRes[0] !== 0xFF && Number.isFinite(countRes[4]) && countRes[4] >= 2 && countRes[4] <= 8) {
              const count = countRes[4];
              const stops = [];
              for (let s = 0; s < count; s++) {
                const stopRes = await this.protocol.getCustomValue(CHANNELS.CUSTOM, 35, p, s);
                if (stopRes && stopRes[0] !== 0xFF && Number.isFinite(stopRes[5])) {
                  stops.push({
                    pos: stopRes[5],
                    r: stopRes[6],
                    g: stopRes[7],
                    b: stopRes[8]
                  });
                }
              }
              if (stops.length >= 2) {
                customGradProfiles.push(stops);
              }
            }
          }

          backup.custom_settings.hardware_gradient = {
            active_gradient: activeGrad,
            profiles: customGradProfiles
          };
        } catch (e) {}

        // Hardware Per-Key RGB Profiles (Profiles 0, 1, 2)
        try {
          const perKeyProfiles = [];
          for (let p = 0; p < 3; p++) {
            const colors = await this.protocol.getPerKeyProfile(p, 144);
            if (colors && colors.length > 0) {
              perKeyProfiles.push(colors);
            }
          }
          if (perKeyProfiles.length > 0) {
            backup.custom_settings.per_key_profiles = perKeyProfiles;
          }
        } catch (e) {}

        this._log("Successfully read debounce time, layer colors, reactive layer, Win Lock, 7 Logo Lock indicators, gradient profiles, and per-key RGB profiles.", "success");
      } catch (err) {
        this._log("Custom settings read warning: " + err.message, "warning");
      }
      if (onProgress) onProgress(100);

      this._log("✔ Complete backup successfully created!", "success");
      return backup;
    }

    async getSnapshotData(onProgress) {
      return await this.createBackup(onProgress);
    }

    async restoreFromSnapshotObject(snapshotData, onProgress) {
      return await this.restoreBackup(snapshotData, onProgress);
    }

    async restoreBackup(backupData, onProgress) {
      if (!this.protocol || !this.protocol.device) {
        throw new Error("Keyboard not connected!");
      }

      if (!backupData || !backupData.layers) {
        throw new Error("Invalid backup file structure.");
      }

      const { CHANNELS, CUSTOM_VAL, RGB_MATRIX_VAL, KEYBOARD_SPECS } = window.GMMK3_CONSTANTS;

      this._log("▶ Starting restore to keyboard memory...", "info");

      // 1. Smart Diff Keycode Writing
      const layers = backupData.layers;
      const rows = KEYBOARD_SPECS.rows;
      const cols = KEYBOARD_SPECS.cols;

      this._log("Analyzing keymap diffs (Smart Diffing)...", "info");
      let currentKeymap = null;
      try {
        currentKeymap = await this.protocol.readFullKeymap(KEYBOARD_SPECS.layers, rows, cols);
      } catch (e) {}

      let diffKeys = [];
      for (let l = 0; l < layers.length && l < KEYBOARD_SPECS.layers; l++) {
        for (let r = 0; r < layers[l].length && r < rows; r++) {
          for (let c = 0; c < layers[l][r].length && c < cols; c++) {
            const targetKc = layers[l][r][c];
            let isDifferent = true;
            if (currentKeymap) {
              const byteIdx = (l * rows * cols * 2) + (r * cols * 2) + (c * 2);
              const currentKc = (currentKeymap[byteIdx] << 8) | currentKeymap[byteIdx + 1];
              isDifferent = (currentKc !== targetKc);
            }
            if (isDifferent) {
              diffKeys.push({ l, r, c, kc: targetKc });
            }
          }
        }
      }

      if (diffKeys.length > 20) {
        this._log(`Detected ${diffKeys.length} modified keys. Fast writing full keymap buffer to EEPROM...`, "info");
        try {
          await this.protocol.writeFullKeymap(backupData.layers, rows, cols, (p) => {
            if (onProgress) onProgress(Math.round((p / 100) * 40));
          });
          this._log(`Wrote ${diffKeys.length} keys to EEPROM memory (Bulk Buffer).`, "success");
        } catch (err) {
          this._log("Bulk write fallback to per-key write: " + err.message, "warning");
          for (let i = 0; i < diffKeys.length; i++) {
            const { l, r, c, kc } = diffKeys[i];
            await this.protocol.setKeycode(l, r, c, kc);
            if (onProgress && i % 3 === 0) {
              onProgress(Math.round(((i + 1) / diffKeys.length) * 40));
            }
            await this.protocol.sleep(2);
          }
          this._log(`Wrote ${diffKeys.length} keys to EEPROM memory.`, "success");
        }
      } else if (diffKeys.length > 0) {
        this._log(`Detected ${diffKeys.length} modified keys. Writing to EEPROM...`, "info");
        for (let i = 0; i < diffKeys.length; i++) {
          const { l, r, c, kc } = diffKeys[i];
          await this.protocol.setKeycode(l, r, c, kc);
          if (onProgress && i % 3 === 0) {
            onProgress(Math.round(((i + 1) / diffKeys.length) * 40));
          }
          await this.protocol.sleep(2);
        }
        this._log(`Wrote ${diffKeys.length} keys to EEPROM memory.`, "success");
      } else {
        this._log("Key layout is identical to backup - skipping redundant writes.", "success");
      }
      if (onProgress) onProgress(40);

      // 2. Restore Rotary Knob (Encoder)
      if (backupData.encoders && Array.isArray(backupData.encoders)) {
        this._log("Restoring rotary knob configuration for all layers...", "info");
        for (const enc of backupData.encoders) {
          if (enc.layer !== undefined) {
            if (enc.ccw !== undefined) await this.protocol.setEncoder(enc.layer, 0, false, enc.ccw);
            if (enc.cw !== undefined) await this.protocol.setEncoder(enc.layer, 0, true, enc.cw);
            if (enc.press !== undefined) await this.protocol.setKeycode(enc.layer, 0, 7, enc.press);
          }
        }
        this._log("Successfully updated rotary knob encoder actions.", "success");
      }
      if (onProgress) onProgress(55);

      // 3. Restore dynamic macros
      if (backupData.macros && backupData.macros.data) {
        this._log("Restoring dynamic macro memory...", "info");
        try {
          await this.protocol.setMacroBuffer(backupData.macros);
          this._log("Macro memory updated successfully.", "success");
        } catch (e) {
          this._log("Macro write error: " + e.message, "warning");
        }
      }
      if (onProgress) onProgress(70);

      // 4. Restore RGB Matrix parameters
      const rgb = backupData.rgb_matrix;
      if (rgb) {
        this._log(`Restoring RGB Matrix settings (Effect #${rgb.effect}, Brightness ${rgb.brightness})...`, "info");
        try {
          if (rgb.brightness !== undefined) await this.protocol.setRGBMatrixValue(RGB_MATRIX_VAL.BRIGHTNESS, rgb.brightness);
          if (rgb.effect !== undefined) await this.protocol.setRGBMatrixValue(RGB_MATRIX_VAL.EFFECT, rgb.effect);
          if (rgb.speed !== undefined) await this.protocol.setRGBMatrixValue(RGB_MATRIX_VAL.EFFECT_SPEED, rgb.speed);
          if (rgb.hue !== undefined && rgb.sat !== undefined) await this.protocol.setRGBMatrixValue(RGB_MATRIX_VAL.COLOR, rgb.hue, rgb.sat);
          await this.protocol.saveCustomConfig(CHANNELS.RGB_MATRIX);
          this._log("Saved RGB Matrix configuration to EEPROM.", "success");
        } catch (e) {
          this._log("RGB restore error: " + e.message, "warning");
        }
      }
      if (onProgress) onProgress(85);

      // 5. Restore custom settings (Debounce, Layer lighting, Reactive, Dim, Win Lock, 7 Logo Lock states)
      const cust = backupData.custom_settings;
      if (cust) {
        this._log("Restoring debounce latency, layer colors, reactive settings, Win Lock, and 7 Logo Lock states...", "info");
        try {
          if (cust.debounce_time !== undefined) {
            const db = (typeof cust.debounce_time === "number" && !isNaN(cust.debounce_time) && cust.debounce_time >= 0 && cust.debounce_time <= 30) ? cust.debounce_time : 5;
            await this.protocol.setDebounceTime(db);
            await new Promise(r => setTimeout(r, 10));

      const pContainer = document.getElementById("backupProgress");
      const pBar = document.getElementById("backupProgressBar");
      const pText = document.getElementById("backupProgressText");
      const pPercent = document.getElementById("backupProgressPercent");

      btn?.addEventListener("click", async () => {
        if (!this.protocol || !this.protocol.device) return;
        try {
          btn.disabled = true;
          if (pContainer) pContainer.style.display = "block";
          if (pBar) pBar.style.width = "0%";
          if (pPercent) pPercent.textContent = "0%";
          if (pText) pText.textContent = window.i18n ? window.i18n.t("backupProgressReading") : "Reading data from keyboard...";

          window.gUI?.showToast(window.i18n ? window.i18n.t("toastCreatingBackup") : "Creating full keyboard backup...", "info");

          const backup = await this.createBackup((pct) => {
            if (pBar) pBar.style.width = `${pct}%`;
            if (pPercent) pPercent.textContent = `${pct}%`;
            if (pct >= 100 && pText) pText.textContent = window.i18n ? window.i18n.t("backupProgressGenerating") : "Generating .JSON file...";
          });

          const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const timestamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
          a.href = url;
          a.download = `GMMK3_Backup_${timestamp}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          window.gUI?.showToast(window.i18n ? window.i18n.t("toastBackupDownloaded") : "Backup file downloaded successfully!", "success");
          if (pText) pText.textContent = window.i18n ? window.i18n.t("backupProgressDone") : "Completed!";
        } catch (e) {
          window.gUI?.showToast(window.i18n ? window.i18n.t("toastBackupError", { err: e.message }) : "Backup error: " + e.message, "error");
          this._log("Error: " + e.message, "error");
        } finally {
          btn.disabled = false;
        }
      });

    _bindRestoreActions() {
      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("fileInput");
      const btnRestore = document.getElementById("btnRestoreBackup");
      const pContainer = document.getElementById("restoreProgress");
      const pBar = document.getElementById("restoreProgressBar");
      const pText = document.getElementById("restoreProgressText");
      const pPercent = document.getElementById("restoreProgressPercent");

      dropzone?.addEventListener("click", () => fileInput?.click());

      dropzone?.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropzone.classList.add("dragover");
      });

      dropzone?.addEventListener("dragleave", () => {
        dropzone.classList.remove("dragover");
      });

      dropzone?.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("dragover");
        if (e.dataTransfer.files?.length > 0) {
          this._handleSelectedFile(e.dataTransfer.files[0]);
        }
      });

      fileInput?.addEventListener("change", (e) => {
        if (e.target.files?.length > 0) {
          this._handleSelectedFile(e.target.files[0]);
        }
      });

      btnRestore?.addEventListener("click", async () => {
        if (!this.stagedBackupData) {
          window.gUI?.showToast(window.i18n ? window.i18n.t("toastSelectValidBackup") : "Please select a valid .JSON backup file!", "warning");
          return;
        }

        try {
          btnRestore.disabled = true;
          if (pContainer) pContainer.style.display = "block";
          if (pBar) pBar.style.width = "0%";
          if (pPercent) pPercent.textContent = "0%";
          if (pText) pText.textContent = window.i18n ? window.i18n.t("restoreProgressWriting") : "Writing settings to EEPROM...";

          window.gUI?.showToast(window.i18n ? window.i18n.t("toastRestoring") : "Flashing backup to keyboard memory...", "info");

          await this.restoreBackup(this.stagedBackupData, (pct) => {
            if (pBar) pBar.style.width = `${pct}%`;
            if (pPercent) pPercent.textContent = `${pct}%`;
            if (pct >= 100 && pText) pText.textContent = window.i18n ? window.i18n.t("restoreProgressRefreshing") : "Refreshing interface...";
          });

          window.gUI?.showToast(window.i18n ? window.i18n.t("toastRestored") : "All settings restored successfully!", "success");
          if (pText) pText.textContent = window.i18n ? window.i18n.t("restoreProgressDone") : "Restored 100%!";

          // Refresh active views
          if (window.gKeymapEditor) await window.gKeymapEditor.loadKeymapFromDevice();
          if (window.gLightingController) await window.gLightingController.loadFromDevice();
        } catch (e) {
          window.gUI?.showToast(window.i18n ? window.i18n.t("toastRestoreError", { err: e.message }) : "Restore error: " + e.message, "error");
          this._log("Error: " + e.message, "error");
        } finally {
          btnRestore.disabled = false;
        }
      });
    }

    _handleSelectedFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed.layers || !Array.isArray(parsed.layers)) {
            throw new Error("Invalid backup file structure (layers array missing)");
          }
          this.stagedBackupData = parsed;
          
          const filePreview = document.getElementById("filePreview");
          if (filePreview) filePreview.style.display = "block";

          const prevFileName = document.getElementById("prevFileName");
          if (prevFileName) prevFileName.textContent = file.name;

          const prevDate = document.getElementById("prevDate");
          if (prevDate) prevDate.textContent = parsed.created_at ? new Date(parsed.created_at).toLocaleString() : "-";

          const prevLayers = document.getElementById("prevLayers");
          if (prevLayers) prevLayers.textContent = window.i18n ? window.i18n.t("valStatLayers", { count: parsed.layers.length }) : `${parsed.layers.length} Layers`;

          const prevEncoder = document.getElementById("prevEncoder");
          if (prevEncoder) {
            prevEncoder.textContent = parsed.encoders
              ? (window.i18n ? window.i18n.t("valStatProfiles", { count: parsed.encoders.length }) : `${parsed.encoders.length} Profiles`)
              : (window.i18n ? window.i18n.t("valStatStandard") : "Standard");
          }

          const prevRgb = document.getElementById("prevRgb");
          if (prevRgb) {
            prevRgb.textContent = parsed.rgb_matrix
              ? `Effect #${parsed.rgb_matrix.effect || 1}`
              : (window.i18n ? window.i18n.t("valStatNone") : "None");
          }

          const prevCustom = document.getElementById("prevCustom");
          if (prevCustom) {
            prevCustom.textContent = parsed.custom_settings
              ? (window.i18n ? window.i18n.t("valStatCustom") : "7 Locks + Layers")
              : (window.i18n ? window.i18n.t("valStatStandard") : "Standard");
          }

          const btnRestore = document.getElementById("btnRestoreBackup");
          if (btnRestore && this.protocol && this.protocol.isConnected) {
            btnRestore.disabled = false;
          }

          this._log(`Loaded backup file: ${file.name} (${(file.size / 1024).toFixed(1)} KB). Ready to flash.`, "success");
        } catch (err) {
          window.gUI?.showToast(window.i18n ? window.i18n.t("toastSelectValidBackup") : ("Invalid .JSON backup file: " + err.message), "error");
          this._log("JSON parse error: " + err.message, "error");
        }
      };
      reader.readAsText(file);
    }

    _bindConsoleActions() {
      const btnClear = document.getElementById("btnClearLog");
      const consoleLog = document.getElementById("consoleLog");
      btnClear?.addEventListener("click", () => {
        if (consoleLog) {
          const clearedMsg = window.i18n ? window.i18n.t("consoleCleared") : "Console cleared.";
          consoleLog.innerHTML = `<div class="log-line"><span class="log-time">[${new Date().toLocaleTimeString()}]</span><span class="log-info">${clearedMsg}</span></div>`;
        }
      });
    }
  }

  window.BackupManager = BackupManager;
})();

    }

      }

    }

          if (Array.isArray(parsed)) {

    init() {

    }

    // --- ENCODING & DECODING VIA DYNAMIC MACRO BYTECODE ---

    /**
     * Decodes null-delimited QMK send_string bytecode buffer into macro strings.
     * QMK send_string protocol:
     *   - SS_QMK_PREFIX (0x01) followed by:
     *     - SS_TAP_CODE (0x01) + keycode (1 byte)
     *     - SS_DOWN_CODE (0x02) + keycode (1 byte)
     *     - SS_UP_CODE (0x03) + keycode (1 byte)
     *     - SS_DELAY_CODE (0x04) + ASCII digits + '|' delimiter
     *   - ASCII characters (0x20 - 0x7E) are literal text
     *   - 0x00 terminates the macro slot
     */
    decodeMacroBuffer(buffer, macroCount = this.macroCount) {
      const result = [];
      for (let i = 0; i < macroCount; i++) {
        result.push("");
      }

      if (!buffer || buffer.length === 0) return result;

      let currentMacro = 0;
      let i = 0;
      const len = buffer.length;

      while (i < len && currentMacro < macroCount) {
        const b = buffer[i];

        if (b === 0x00) {
          currentMacro++;
          i++;
          continue;
        }

        // QMK SS_QMK_PREFIX: 0x01
        if (b === 0x01 && i + 1 < len) {
          const action = buffer[i + 1];

          // 1. SS_TAP_CODE: 0x01 + keycode
          if (action === 0x01 && i + 2 < len) {
            const kc = buffer[i + 2];
            const name = CODE_TO_NAME[kc] || `0x${kc.toString(16).toUpperCase()}`;
            result[currentMacro] += `{${name}}`;
            i += 3;
            continue;
          }

          // 2. SS_DOWN_CODE: 0x02 + keycode
          if (action === 0x02 && i + 2 < len) {
            const kc = buffer[i + 2];
            const name = CODE_TO_NAME[kc] || `0x${kc.toString(16).toUpperCase()}`;
            result[currentMacro] += `{+${name}}`;
            i += 3;
            continue;
          }

          // 3. SS_UP_CODE: 0x03 + keycode
          if (action === 0x03 && i + 2 < len) {
            const kc = buffer[i + 2];
            const name = CODE_TO_NAME[kc] || `0x${kc.toString(16).toUpperCase()}`;
            result[currentMacro] += `{-${name}}`;
            i += 3;
            continue;
          }

          // 4. SS_DELAY_CODE: 0x04 + ASCII digits + '|'
          if (action === 0x04) {
            let dStr = "";
            let dIdx = i + 2;
            while (dIdx < len && buffer[dIdx] >= 0x30 && buffer[dIdx] <= 0x39) {
              dStr += String.fromCharCode(buffer[dIdx]);
              dIdx++;
            }
            if (dIdx < len && buffer[dIdx] === 0x7C) {
              dIdx++; // skip delimiter '|'
            }
            if (dStr.length > 0) {
              result[currentMacro] += `{${dStr}ms}`;
            }
            i = dIdx;
            continue;
          }

          // Unknown prefix action - skip prefix and action
          i += 2;
          continue;
        }

        // Standard ASCII printable character
        if (b >= 32 && b <= 126) {
          result[currentMacro] += String.fromCharCode(b);
          i++;
        } else {
          // Ignore unhandled non-printable control byte
          i++;
        }
      }

      return result;
    }

    /**
     * Encodes macro strings into a null-delimited QMK send_string bytecode array.
     */
    encodeMacroBuffer(macros = this.macros, targetBufferSize = this.bufferSize) {
      const bytes = [];

      for (let mIdx = 0; mIdx < macros.length; mIdx++) {
        const text = (typeof macros[mIdx] === "string") ? macros[mIdx] : (macros[mIdx].text || "");
        let i = 0;

        while (i < text.length) {
          if (text[i] === "{") {
            const closeIdx = text.indexOf("}", i);
            if (closeIdx !== -1) {
              const tag = text.substring(i + 1, closeIdx).trim();
              i = closeIdx + 1;

              // 1. Delay tag: e.g. {100}, {100ms}, {delay:100} -> \1\4 <digits> |
              const delayMatch = tag.match(/^(?:delay\s*:\s*)?(\d+)(?:ms)?$/i);
              if (delayMatch) {
                const msStr = delayMatch[1];
                bytes.push(0x01); // SS_QMK_PREFIX
                bytes.push(0x04); // SS_DELAY_CODE
                for (let c = 0; c < msStr.length; c++) {
                  bytes.push(msStr.charCodeAt(c));
                }
                bytes.push(0x7C); // '|' delimiter consumed by QMK
                continue;
              }

              // 2. Key down: {+KC_LCTRL} -> \1\2 <kc>
              if (tag.startsWith("+")) {
                const kcName = tag.substring(1).trim().toUpperCase();
                const kcCode = QMK_KC_MAP[kcName];
                if (kcCode !== undefined) {
                  bytes.push(0x01); // SS_QMK_PREFIX
                  bytes.push(0x02); // SS_DOWN_CODE
                  bytes.push(kcCode);
                  continue;
                }
              }

              // 3. Key up: {-KC_LCTRL} -> \1\3 <kc>
              if (tag.startsWith("-")) {
                const kcName = tag.substring(1).trim().toUpperCase();
                const kcCode = QMK_KC_MAP[kcName];
                if (kcCode !== undefined) {
                  bytes.push(0x01); // SS_QMK_PREFIX
                  bytes.push(0x03); // SS_UP_CODE
                  bytes.push(kcCode);
                  continue;
                }
              }

              // 4. Key tap: {KC_ENTER}, {KC_A} -> \1\1 <kc>
              const kcCode = QMK_KC_MAP[tag.toUpperCase()];
              if (kcCode !== undefined) {
                bytes.push(0x01); // SS_QMK_PREFIX
                bytes.push(0x01); // SS_TAP_CODE
                bytes.push(kcCode);
                continue;
              }

              // If unknown tag, emit literally
              for (let c = 0; c < tag.length; c++) {
                bytes.push(tag.charCodeAt(c) & 0xFF);
              }
              continue;
            }
          }

          // Plain ASCII character
          const code = text.charCodeAt(i);
          if (code >= 32 && code <= 126) {
            bytes.push(code);
          }
          i++;
        }

        // Terminate each macro with null byte 0x00
        bytes.push(0x00);
      }

      // Ensure total byte count does not exceed targetBufferSize
      if (bytes.length > targetBufferSize) {
        console.warn(`Macro buffer overflow: ${bytes.length} > ${targetBufferSize} bytes`);
        bytes.length = targetBufferSize;
        bytes[targetBufferSize - 1] = 0x00;
      } else {
        // Zero-pad to complete buffer size
        while (bytes.length < targetBufferSize) {
          bytes.push(0x00);
        }
      }

      return bytes;
    }

    calculateTotalUsedBytes() {
      let total = 0;
      for (const m of this.macros) {
        const text = m.text || "";
        let i = 0;
        let count = 0;
        while (i < text.length) {
          if (text[i] === "{") {
            const closeIdx = text.indexOf("}", i);
            if (closeIdx !== -1) {
              const tag = text.substring(i + 1, closeIdx).trim();
              i = closeIdx + 1;
              const delayMatch = tag.match(/^(?:delay\s*:\s*)?(\d+)(?:ms)?$/i);
              if (delayMatch) {
                count += 2 + delayMatch[1].length + 1; // 0x01 + 0x04 + digits + '|'
                continue;
              }
              if (tag.startsWith("+") || tag.startsWith("-")) {
                count += 3; // 0x01 + action + keycode
                continue;
              }
              if (QMK_KC_MAP[tag.toUpperCase()] !== undefined) {
                count += 3; // 0x01 + 0x01 + keycode
                continue;
              }
            }
          }
          count++;
          i++;
        }
        count += 1; // null terminator
        total += count;
      }
      return total;
    }

    // --- HARDWARE COMMUNICATIONS ---

    async loadFromDevice() {
      if (!this.protocol || !this.protocol.isConnected) {
        return;
      }

      try {
        const count = await this.protocol.getMacroCount();
        if (typeof count === "number" && count > 0) {
          this.macroCount = Math.min(32, count);
        }

        const bufSize = await this.protocol.getMacroBufferSize();
        if (typeof bufSize === "number" && bufSize > 0) {
          this.bufferSize = bufSize;
        }

        const bufObj = await this.protocol.getMacroBuffer();
        if (bufObj && Array.isArray(bufObj.data) && bufObj.data.length > 0) {
          const decoded = this.decodeMacroBuffer(bufObj.data, this.macroCount);
          decoded.forEach((str, idx) => {
            if (idx < this.macros.length) {
              this.macros[idx].text = str;
            } else {
              this.macros.push({
                id: idx,
                label: `Macro ${idx}`,
                text: str
              });
            }
          });
          this._saveToLocalStorage();
          this.render();
          const usedBytes = this.calculateTotalUsedBytes();
          if (window.gUI) {
            window.gUI.showToast(
              window.i18n
                ? window.i18n.t("toastMacrosLoaded", {
                    count: this.macroCount,
                    used: usedBytes,
                    total: this.bufferSize
                  })
                : `Loaded ${this.macroCount} macros from keyboard EEPROM (${usedBytes} / ${this.bufferSize} bytes)`,
              "success"
            );
          }
        }
      } catch (err) {
        console.warn("Could not load macros from device:", err);
      }
    }

    async saveToDevice() {
      if (!this.protocol || !this.protocol.isConnected) {
        if (window.gUI) {
          window.gUI.showToast(
            window.i18n ? window.i18n.t("toastDeviceNotConnected") : "Please connect keyboard first",
            "warning"
          );
        }
        return;
      }

      try {
        const encodedBuffer = this.encodeMacroBuffer(this.macros, this.bufferSize);
        await this.protocol.setMacroBuffer({ data: encodedBuffer });
        this._saveToLocalStorage();
        this.render();
        if (window.gUI) {
          window.gUI.showToast(
            window.i18n ? window.i18n.t("toastMacrosSaved") : "Macros saved to keyboard EEPROM",
            "success"
          );
        }
      } catch (err) {
        console.error("Failed to save macros to device:", err);
        if (window.gUI) {
          window.gUI.showToast(
            window.i18n
              ? window.i18n.t("toastMacrosSaveError", { msg: err.message || "Unknown error" })
              : `Failed to save macros: ${err.message}`,
            "error"
          );
        }
      }
    }

    async resetMacros() {
      if (!this.protocol || !this.protocol.isConnected) {
        this._initDefaultMacros();
        this.render();
        return;
      }

      try {
        await this.protocol.resetMacros();
        this._initDefaultMacros();
        this._saveToLocalStorage();
        this.render();
        if (window.gUI) {
          window.gUI.showToast(
            window.i18n ? window.i18n.t("toastMacrosReset") : "All macros cleared on keyboard",
            "info"
          );
        }
      } catch (err) {
        console.error("Failed to reset macros on device:", err);
      }
    }

    // --- KEYSTROKE RECORDER ---

    toggleRecording() {
      if (this.isRecording) {
        this.stopRecording();
      } else {
        this.startRecording();
      }
    }

    startRecording() {
      this.isRecording = true;
      this._lastEventTime = performance.now();

      const btnRecord = document.getElementById("btnRecordMacro");
      const recordStatus = document.getElementById("macroRecordStatus");
      if (btnRecord) {
        btnRecord.classList.add("recording");
        const span = btnRecord.querySelector("span:last-child");
        if (span && window.i18n) span.textContent = window.i18n.t("btnStopRecord");
      }
      if (recordStatus) {
        recordStatus.style.display = "inline-flex";
      }

      this._recordingHandlerDown = (e) => {
        // Prevent recording shortcut keys when pressing Stop button
        if (e.target && e.target.id === "btnRecordMacro") return;
        e.preventDefault();

        const now = performance.now();
        const delta = Math.round(now - this._lastEventTime);
        this._lastEventTime = now;

        const qmkKc = JS_CODE_TO_QMK[e.code];
        if (!qmkKc) return;

        let insert = "";
        if (delta > 35 && delta < 5000) {
          insert += `{${delta}ms}`;
        }

        const isModifier = ["KC_LCTRL", "KC_RCTRL", "KC_LSHIFT", "KC_RSHIFT", "KC_LALT", "KC_RALT", "KC_LGUI", "KC_RGUI"].includes(qmkKc);
        if (isModifier) {
          insert += `{+${qmkKc}}`;
        } else {
          insert += `{${qmkKc}}`;
        }

        this.insertTextAtCursor(insert);
      };

      this._recordingHandlerUp = (e) => {
        if (e.target && e.target.id === "btnRecordMacro") return;
        e.preventDefault();

        const qmkKc = JS_CODE_TO_QMK[e.code];
        if (!qmkKc) return;

        const isModifier = ["KC_LCTRL", "KC_RCTRL", "KC_LSHIFT", "KC_RSHIFT", "KC_LALT", "KC_RALT", "KC_LGUI", "KC_RGUI"].includes(qmkKc);
        if (isModifier) {
          this.insertTextAtCursor(`{-${qmkKc}}`);
        }
      };

      window.addEventListener("keydown", this._recordingHandlerDown, { capture: true });
      window.addEventListener("keyup", this._recordingHandlerUp, { capture: true });
    }

    stopRecording() {
      this.isRecording = false;

      const btnRecord = document.getElementById("btnRecordMacro");
      const recordStatus = document.getElementById("macroRecordStatus");
      if (btnRecord) {
        btnRecord.classList.remove("recording");
        const span = btnRecord.querySelector("span:last-child");
        if (span && window.i18n) span.textContent = window.i18n.t("btnStartRecord");
      }
      if (recordStatus) {
        recordStatus.style.display = "none";
      }

      if (this._recordingHandlerDown) {
        window.removeEventListener("keydown", this._recordingHandlerDown, { capture: true });
        this._recordingHandlerDown = null;
      }
      if (this._recordingHandlerUp) {
        window.removeEventListener("keyup", this._recordingHandlerUp, { capture: true });
        this._recordingHandlerUp = null;
      }
    }

    insertTextAtCursor(insertText) {
      const textarea = document.getElementById("macroContentEditor");
      if (!textarea) return;

      const start = textarea.selectionStart || 0;
      const end = textarea.selectionEnd || 0;
      const val = textarea.value;

      textarea.value = val.substring(0, start) + insertText + val.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + insertText.length;
      textarea.focus();

      this.macros[this.activeMacroId].text = textarea.value;
      this._saveToLocalStorage();
      this.updateMemoryGauge();
      this.updateSlotListSnippets();
    }

    // --- UI BINDINGS & RENDERING ---

    _bindUI() {
      const textarea = document.getElementById("macroContentEditor");
      if (textarea) {
        textarea.addEventListener("input", (e) => {
          this.macros[this.activeMacroId].text = e.target.value;
          this._saveToLocalStorage();
          this.updateMemoryGauge();
          this.updateSlotListSnippets();
        });
      }

      const labelInput = document.getElementById("macroNameInput");
      if (labelInput) {
        labelInput.addEventListener("input", (e) => {
          this.macros[this.activeMacroId].label = e.target.value || `Macro ${this.activeMacroId}`;
          this._saveToLocalStorage();
          this.updateSlotListSnippets();
        });
      }

      const btnRecord = document.getElementById("btnRecordMacro");
      if (btnRecord) {
        btnRecord.addEventListener("click", () => this.toggleRecording());
      }

      const btnSave = document.getElementById("btnSaveMacros");
      if (btnSave) {
        btnSave.addEventListener("click", () => this.saveToDevice());
      }

      const btnReload = document.getElementById("btnReloadMacros");
      if (btnReload) {
        btnReload.addEventListener("click", () => this.loadFromDevice());
      }

      const btnClear = document.getElementById("btnClearCurrentMacro");
      if (btnClear) {
        btnClear.addEventListener("click", () => {
          this.macros[this.activeMacroId].text = "";
          if (textarea) textarea.value = "";
          this._saveToLocalStorage();
          this.updateMemoryGauge();
          this.updateSlotListSnippets();
        });
      }

      const btnResetAll = document.getElementById("btnResetAllMacros");
      if (btnResetAll) {
        btnResetAll.addEventListener("click", () => {
          if (confirm(window.i18n ? window.i18n.t("confirmResetMacros") : "Are you sure you want to clear all macros?")) {
            this.resetMacros();
          }
        });
      }

      // Quick syntax insertion buttons
      document.querySelectorAll("[data-macro-insert]").forEach((btn) => {
        btn.addEventListener("click", () => {
          this.insertTextAtCursor(btn.dataset.macroInsert);
        });
      });
    }

    selectMacro(id) {
      if (id < 0 || id >= this.macroCount) return;
      this.activeMacroId = id;

      const textarea = document.getElementById("macroContentEditor");
      const labelInput = document.getElementById("macroNameInput");
      const activeTitle = document.getElementById("macroActiveTitleBadge");

      if (textarea) textarea.value = this.macros[id].text || "";
      if (labelInput) labelInput.value = this.macros[id].label || `Macro ${id}`;
      if (activeTitle) activeTitle.textContent = `M${id}`;

      document.querySelectorAll(".macro-slot-card").forEach((card) => {
        if (parseInt(card.dataset.macroId, 10) === id) {
          card.classList.add("active");
        } else {
          card.classList.remove("active");
        }
      });

      this.updateMemoryGauge();
    }

    render() {
      this.renderSlotList();
      this.selectMacro(this.activeMacroId);
      this.updateMemoryGauge();
    }

    renderSlotList() {
      const container = document.getElementById("macroSlotsList");
      if (!container) return;

      container.innerHTML = "";

      for (let i = 0; i < this.macroCount; i++) {
        const m = this.macros[i] || { id: i, label: `Macro ${i}`, text: "" };
        const card = document.createElement("button");
        card.className = `macro-slot-card ${i === this.activeMacroId ? "active" : ""}`;
        card.dataset.macroId = i;
        card.type = "button";

        const hasContent = (m.text && m.text.trim().length > 0);
        const preview = hasContent ? m.text : (window.i18n ? window.i18n.t("macroSlotEmpty") : "Empty");

        card.innerHTML = `
          <div class="macro-slot-header">
            <div class="macro-slot-id">
              <span class="macro-slot-dot ${hasContent ? "filled" : ""}"></span>
              <strong>M${i}</strong>
            </div>
            <span class="macro-slot-name">${m.label || `Macro ${i}`}</span>
          </div>
          <div class="macro-slot-snippet">${this._escapeHtml(preview)}</div>
        `;

        card.addEventListener("click", () => this.selectMacro(i));
        container.appendChild(card);
      }
    }

    updateSlotListSnippets() {
      document.querySelectorAll(".macro-slot-card").forEach((card) => {
        const id = parseInt(card.dataset.macroId, 10);
        const m = this.macros[id];
        if (!m) return;

        const dot = card.querySelector(".macro-slot-dot");
        const nameEl = card.querySelector(".macro-slot-name");
        const snippetEl = card.querySelector(".macro-slot-snippet");

        const hasContent = (m.text && m.text.trim().length > 0);
        if (dot) dot.className = `macro-slot-dot ${hasContent ? "filled" : ""}`;
        if (nameEl) nameEl.textContent = m.label || `Macro ${id}`;
        if (snippetEl) {
          const preview = hasContent ? m.text : (window.i18n ? window.i18n.t("macroSlotEmpty") : "Empty");
          snippetEl.textContent = preview;
        }
      });
    }

    updateMemoryGauge() {
      const usedBytes = this.calculateTotalUsedBytes();
      const pct = Math.min(100, Math.round((usedBytes / this.bufferSize) * 100));

      const fill = document.getElementById("macroMemoryGaugeFill");
      const text = document.getElementById("macroMemoryGaugeText");

      if (fill) {
        fill.style.width = `${pct}%`;
        fill.style.backgroundColor = pct > 90 ? "#ef4444" : (pct > 75 ? "#f59e0b" : "var(--accent-cyan, #00f0ff)");
      }

      if (text) {
        text.textContent = `${usedBytes} / ${this.bufferSize} B (${pct}%)`;
      }
    }

    _escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  }

  window.MacroManager = MacroManager;
})();

/**
 * LuxQMK Studio - Smart Firmware Flasher & Upgrade Manager
 * Automates 100% Zero-Data-Loss Firmware Flashing:
 * Phase 1: Silent Pre-Flash Backup (Layers, Macros, RGB, Encoders, EEPROM)
 * Phase 2: DFU Bootloader Jump
 * Phase 3: Hardware DFU Flashing (wb32-dfu-updater_cli / dfu-util)
 * Phase 4: Auto-Reconnect Detection
 * Phase 5: Silent Post-Flash Memory Restoration
 */

(function () {
  class FirmwareFlasher {
    constructor() {
      this.selectedFile = null;
      this.isFlashing = false;
      this.pendingRestoreSnapshot = null;
      this.flasherToolsStatus = { wb32Available: false, dfuUtilAvailable: false };
      this.activeStep = 0; // 0=idle, 1=backup, 2=dfu, 3=flash, 4=restore, 5=done
    }

    async init() {
      this._bindUI();
      await this.checkFlasherTools();
    }

    async checkFlasherTools() {
      if (window.electronAPI && typeof window.electronAPI.getFlasherToolsStatus === "function") {
        try {
          this.flasherToolsStatus = await window.electronAPI.getFlasherToolsStatus();
          this._updateToolsBadge();
        } catch (e) {
          console.warn("Could not query flasher tools status:", e);
        }
      } else {
        this._updateToolsBadge(true);
      }
    }

    _updateToolsBadge(isWeb = false) {
      const badge = document.getElementById("flasherToolBadge");
      if (!badge) return;

      if (isWeb || !window.electronAPI || !window.electronAPI.isDesktop) {
        badge.textContent = window.i18n ? window.i18n.t("flasherToolWebMode") : "Web Mode (Manual DFU)";
        badge.className = "badge-pill badge-warning";
        return;
      }

      if (this.flasherToolsStatus.wb32Available || this.flasherToolsStatus.dfuUtilAvailable) {
        badge.textContent = window.i18n ? window.i18n.t("flasherToolReady") : "DFU Flasher Ready (WB32 / STM32)";
        badge.className = "badge-pill badge-success";
      } else {
        badge.textContent = window.i18n ? window.i18n.t("flasherToolNotFound") : "Flasher CLI Not Detected";
        badge.className = "badge-pill badge-warning";
      }
    }

    _bindUI() {
      const dropzone = document.getElementById("flasherDropzone");
      const fileInput = document.getElementById("flasherFileInput");
      const btnSelect = document.getElementById("btnSelectFirmware");
      const btnFlash = document.getElementById("btnStartSmartFlash");
      const btnCancel = document.getElementById("btnCancelSmartFlash");
      const btnClearFile = document.getElementById("btnClearSelectedFirmware");

      // File selection handlers
      btnSelect?.addEventListener("click", () => this.selectFile());
      dropzone?.addEventListener("click", (e) => {
        if (e.target !== btnClearFile) this.selectFile();
      });

      dropzone?.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropzone.classList.add("dragover");
      });

      dropzone?.addEventListener("dragleave", () => {
        dropzone.classList.remove("dragover");
      });

      dropzone?.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("dragover");
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          this._handleBrowserFile(e.dataTransfer.files[0]);
        }
      });

      fileInput?.addEventListener("change", (e) => {
        if (e.target.files && e.target.files.length > 0) {
          this._handleBrowserFile(e.target.files[0]);
        }
      });

      btnClearFile?.addEventListener("click", (e) => {
        e.stopPropagation();
        this.clearFile();
      });

      btnFlash?.addEventListener("click", () => {
        this.startSmartFlash();
      });

      btnCancel?.addEventListener("click", () => {
        this.cancelFlash();
      });

      // Hook Electron Progress IPC
      if (window.electronAPI && typeof window.electronAPI.onFlasherProgress === "function") {
        window.electronAPI.onFlasherProgress((progress) => {
          this._handleFlasherProgress(progress);
        });
      }
    }

    async selectFile() {
      if (this.isFlashing) return;

      if (window.electronAPI && typeof window.electronAPI.selectFirmwareFile === "function") {
        try {
          const fileInfo = await window.electronAPI.selectFirmwareFile();
          if (fileInfo) {
            this.selectedFile = fileInfo;
            this._updateFileUI();
          }
        } catch (e) {
          console.error("Error selecting file via native dialog:", e);
        }
      } else {
        const fileInput = document.getElementById("flasherFileInput");
        fileInput?.click();
      }
    }

    _handleBrowserFile(file) {
      if (!file) return;
      this.selectedFile = {
        filePath: file.path || file.name,
        fileName: file.name,
        fileSize: file.size,
        extension: file.name.split(".").pop().toLowerCase(),
        fileObject: file
      };
      this._updateFileUI();
    }

    clearFile() {
      this.selectedFile = null;
      this._updateFileUI();
    }

    _updateFileUI() {
      const dropzone = document.getElementById("flasherDropzone");
      const dropzoneContent = document.getElementById("flasherDropzoneContent");
      const fileCard = document.getElementById("flasherFileCard");
      const fileNameEl = document.getElementById("flasherFileName");
      const fileSizeEl = document.getElementById("flasherFileSize");
      const btnFlash = document.getElementById("btnStartSmartFlash");

      if (this.selectedFile) {
        if (dropzoneContent) dropzoneContent.style.display = "none";
        if (fileCard) fileCard.style.display = "flex";
        if (fileNameEl) fileNameEl.textContent = this.selectedFile.fileName;
        if (fileSizeEl) fileSizeEl.textContent = `${(this.selectedFile.fileSize / 1024).toFixed(1)} KB`;
        if (btnFlash) btnFlash.disabled = false;
        dropzone?.classList.add("has-file");
      } else {
        if (dropzoneContent) dropzoneContent.style.display = "flex";
        if (fileCard) fileCard.style.display = "none";
        if (btnFlash) btnFlash.disabled = true;
        dropzone?.classList.remove("has-file");
      }
    }

    _setStep(stepNumber, status = "active") {
      this.activeStep = stepNumber;
      for (let i = 1; i <= 4; i++) {
        const stepEl = document.getElementById(`flasherStep${i}`);
        if (!stepEl) continue;
        stepEl.classList.remove("active", "completed", "pending");
        if (i < stepNumber) {
          stepEl.classList.add("completed");
        } else if (i === stepNumber) {
          stepEl.classList.add(status);
        } else {
          stepEl.classList.add("pending");
        }
      }
    }

    _setProgress(percent, label) {
      const pBar = document.getElementById("flasherProgressBar");
      const pPercent = document.getElementById("flasherProgressPercent");
      const pLabel = document.getElementById("flasherProgressLabel");

      if (pBar) pBar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
      if (pPercent) pPercent.textContent = `${Math.round(percent)}%`;
      if (pLabel && label) pLabel.textContent = label;
    }

    _appendLog(message, type = "info") {
      const consoleEl = document.getElementById("flasherConsoleLog");
      if (!consoleEl) return;
      const line = document.createElement("div");
      line.className = `log-line log-${type}`;
      const timeStr = new Date().toLocaleTimeString();
      line.innerHTML = `<span class="log-time">[${timeStr}]</span> <span class="log-text">${message}</span>`;
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    _handleFlasherProgress({ percent, phase, log }) {
      if (!this.isFlashing) return;

      // Map progress from Electron DFU process (35% to 80% range in overall UI)
      const mappedPercent = 35 + (percent * 0.45);
      this._setProgress(mappedPercent, log);
      if (log) this._appendLog(log, phase === "erasing" ? "warning" : "info");

      if (phase === "rebooting" || percent >= 100) {
        this._setStep(3, "completed");
        this._setStep(4, "active");
        this._setProgress(85, window.i18n ? window.i18n.t("flasherWaitingReconnect") : "Firmware flashed. Waiting for keyboard restart...");
      }
    }

    async startSmartFlash() {
      if (!this.selectedFile) {
        window.gUI?.showToast(window.i18n ? window.i18n.t("flasherErrNoFile") : "Please select a firmware .bin file first!", "warning");
        return;
      }

      const isDeviceConnected = window.gProtocol && window.gProtocol.isConnected;

      // If device is not connected via WebHID (e.g. user already plugged it in holding Esc for DFU mode),
      // check if we have a saved pre-flash snapshot in memory or disk cache
      if (!isDeviceConnected && !this.pendingRestoreSnapshot) {
        if (window.electronAPI && typeof window.electronAPI.loadPreflashBackup === "function") {
          try {
            const cached = await window.electronAPI.loadPreflashBackup();
            if (cached) {
              this.pendingRestoreSnapshot = cached;
            }
          } catch (e) {
            console.warn("Could not load preflash cache:", e);
          }
        }
      }

      const confirmMsg = isDeviceConnected
        ? (window.i18n ? window.i18n.t("flasherConfirmUpgrade") : "Ready to start Smart Firmware Upgrade? All keymaps, macros, and RGB profiles will be automatically preserved.")
        : (this.pendingRestoreSnapshot
            ? "Klawiatura jest w trybie DFU (rozłączona z WebHID). Wykryto zachowaną kopię zapasową pamięci. Rozpocząć programowanie Flash i automatyczne przywracanie?"
            : "Klawiatura nie jest połączona przez WebHID (tryb DFU). Rozpocząć bezpośrednie programowanie pamięci Flash plikiem .bin?");

      if (!confirm(confirmMsg)) return;

      this.isFlashing = true;
      const btnFlash = document.getElementById("btnStartSmartFlash");
      const btnCancel = document.getElementById("btnCancelSmartFlash");
      const progressContainer = document.getElementById("flasherProgressContainer");
      const consoleWrapper = document.getElementById("flasherConsoleWrapper");

      if (btnFlash) btnFlash.disabled = true;
      if (btnCancel) btnCancel.style.display = "inline-flex";
      if (progressContainer) progressContainer.style.display = "block";
      if (consoleWrapper) consoleWrapper.style.display = "block";

      this._appendLog("=== Starting Smart Firmware Upgrade Pipeline (Zero Data Loss) ===", "info");
      this._appendLog(`Selected Firmware File: ${this.selectedFile.fileName} (${(this.selectedFile.fileSize / 1024).toFixed(1)} KB)`, "info");

      try {
        if (isDeviceConnected) {
          // ================================================================
          // STEP 1: Pre-Flash Auto-Backup (Layers, Macros, RGB, Settings)
          // ================================================================
          this._setStep(1, "active");
          this._setProgress(10, window.i18n ? window.i18n.t("flasherStep1Text") : "Creating full memory backup (Layers, Macros, RGB)...");
          this._appendLog("Phase 1: Reading complete EEPROM memory snapshot via WebHID...", "info");

          if (!window.gBackupManager) {
            throw new Error("BackupManager module not initialized.");
          }

          const snapshot = await window.gBackupManager.getSnapshotData((pct) => {
            this._setProgress(Math.round(5 + (pct * 0.15)), "Capturing keyboard EEPROM snapshot...");
          });

          this.pendingRestoreSnapshot = snapshot;
          this._appendLog("Snapshot captured: 3 Layers, Rotary Knob, 16 Macros, RGB Matrix & Custom Lock Indicators.", "success");

          // Save temporary cache to disk via Electron as power-outage safeguard
          if (window.electronAPI && typeof window.electronAPI.savePreflashBackup === "function") {
            const saveRes = await window.electronAPI.savePreflashBackup(snapshot);
            if (saveRes && saveRes.success) {
              this._appendLog(`Kopia bezpieczeństwa zachowana w pamięci RAM oraz w buforze cache: ${saveRes.filePath}`, "success");
            }
          }

          this._setStep(1, "completed");
          this._setProgress(22, window.i18n ? window.i18n.t("flasherBackupDone") : "Memory snapshot safely saved.");

          // ================================================================
          // STEP 2: Reboot to Bootloader (DFU Mode)
          // ================================================================
          this._setStep(2, "active");
          this._setProgress(28, window.i18n ? window.i18n.t("flasherStep2Text") : "Rebooting keyboard into DFU Bootloader Mode...");
          this._appendLog("Phase 2: Sending VIA jump-to-bootloader command...", "info");

          try {
            await window.gProtocol.jumpToBootloader();
          } catch (e) {
            console.warn("Bootloader jump notice:", e);
          }

          this._setStep(2, "completed");
          this._setProgress(35, "Keyboard entered DFU Mode.");
          this._appendLog("Keyboard rebooted into DFU Mode. Device disconnected from WebHID.", "info");

          // Wait brief delay for OS USB DFU enumeration
          await new Promise((r) => setTimeout(r, 1200));
        } else {
          // Device is already in DFU mode (e.g. manual Esc plug-in)
          this._setStep(1, "completed");
          if (this.pendingRestoreSnapshot) {
            this._appendLog("Phase 1: Wykorzystanie zachowanej kopii zapasowej pamięci EEPROM z pamięci cache.", "success");
          } else {
            this._appendLog("Phase 1: Tryb bezpośredni DFU (brak aktywnego połączenia WebHID przed wejściem w bootloader).", "info");
          }
          this._setStep(2, "completed");
          this._appendLog("Phase 2: Klawiatura jest już w trybie DFU Bootloader.", "info");
          this._setProgress(35, "Keyboard in DFU Mode. Ready for flashing.");
        }

        // ================================================================
        // STEP 3: Execute Hardware DFU Flashing
        // ================================================================
        this._setStep(3, "active");
        this._setProgress(40, window.i18n ? window.i18n.t("flasherStep3Text") : "Flashing firmware to microcontroller...");
        this._appendLog("Phase 3: Starting wb32-dfu-updater / dfu-util flash process...", "info");

        if (window.electronAPI && typeof window.electronAPI.flashFirmware === "function") {
          const flashResult = await window.electronAPI.flashFirmware({
            filePath: this.selectedFile.filePath,
            toolType: "wb32"
          });

          if (!flashResult || !flashResult.success) {
            throw new Error(flashResult?.error || "Flashing process failed.");
          }

          this._appendLog("Hardware flash write verified 100% OK!", "success");
        } else {
          // Web Mode Fallback: Inform user to flash via external tool and wait
          this._appendLog("Web Browser Mode: Flash the .bin file via QMK Toolbox or DFU, then reconnect.", "warning");
        }

        // ================================================================
        // STEP 4: Auto-Reconnect Detection & Memory Restoration
        // ================================================================
        this._setStep(4, "active");
        this._setProgress(82, window.i18n ? window.i18n.t("flasherStep4Text") : "Waiting for keyboard restart & auto-restoring memory...");
        this._appendLog("Phase 4: Waiting for keyboard to boot up with new firmware...", "info");

        const reconnected = await this._waitForKeyboardReconnect(25000);
        if (!reconnected) {
          throw new Error("Keyboard did not reconnect within timeout. Please click Reconnect manually.");
        }

        this._appendLog("Keyboard reconnected via WebHID! Restoring your keymaps, macros & RGB...", "info");
        this._setProgress(90, "Restoring your custom keymaps, macros, and lighting...");

        // Small delay to allow QMK to complete hardware boot init
        await new Promise((r) => setTimeout(r, 600));

        if (this.pendingRestoreSnapshot) {
          await window.gBackupManager.restoreFromSnapshotObject(this.pendingRestoreSnapshot, (pct) => {
            this._setProgress(Math.round(90 + (pct * 0.1)), "Writing restored layout to new EEPROM...");
          });
          this._appendLog("All 3 Layers, 16 Macros, RGB Matrix, and Lock Indicators restored 100%!", "success");
        }

        // ================================================================
        // STEP 5: Completion & UI Update
        // ================================================================
        this._setStep(4, "completed");
        this._setProgress(100, window.i18n ? window.i18n.t("flasherSuccessTitle") : "Smart Firmware Upgrade Completed Successfully!");
        this._appendLog("✔ SMART FIRMWARE UPGRADE COMPLETED: ZERO DATA LOSS ACHIEVED!", "success");

        const successMsg = window.i18n
          ? window.i18n.t("flasherSuccessToast")
          : "Firmware successfully updated! All custom keymaps, macros, and lighting have been preserved.";
        window.gUI?.showToast(successMsg, "success");

        // Refresh UI views
        if (window.gKeymapEditor) await window.gKeymapEditor.loadKeymapFromDevice();
        if (window.gLightingController) await window.gLightingController.loadFromDevice();

      } catch (err) {
        console.error("Smart Flash Error:", err);
        this._appendLog(`Błąd w trakcie procesu: ${err.message}`, "error");
        this._setProgress(0, `Błąd: ${err.message}`);
        const errMsg = window.i18n ? window.i18n.t("flasherErrorToast", { err: err.message }) : ("Błąd programatora: " + err.message);
        window.gUI?.showToast(errMsg, "error");

        if (err.message && (err.message.includes("Bootloader") || err.message.includes("DFU") || err.message.includes("Esc") || err.message.includes("15 sekund"))) {
          this._appendLog("💡 WSKAZÓWKA: W standardzie QMK / LuxQMK, aby ręcznie wejść w tryb DFU Bootloadera: odłącz kabel USB, przytrzymaj klawisz Esc (lub wciśnij przycisk Reset na PCB) podczas ponownego podłączania kabla USB. Następnie kliknij 'Rozpocznij bezstratną aktualizację' — programator natychmiast wykryje urządzenie i wgra firmware, a po restarcie przywróci ustawienia z kopii zapasowej.", "warning");
        }
      } finally {
        this.isFlashing = false;
        if (btnFlash) btnFlash.disabled = !this.selectedFile;
        if (btnCancel) btnCancel.style.display = "none";
      }
    }

    async cancelFlash() {
      if (window.electronAPI && typeof window.electronAPI.cancelFlash === "function") {
        await window.electronAPI.cancelFlash();
      }
      this.isFlashing = false;
      this._appendLog("Proces aktualizacji został anulowany przez użytkownika.", "warning");
      this._setProgress(0, "Anulowano.");
      this._resetUIState();
    }

    _resetUIState() {
      const btnFlash = document.getElementById("btnStartSmartFlash");
      const btnCancel = document.getElementById("btnCancelSmartFlash");
      if (btnFlash) btnFlash.disabled = !this.selectedFile;
      if (btnCancel) btnCancel.style.display = "none";
      for (let i = 1; i <= 4; i++) {
        const s = document.getElementById(`flasherStep${i}`);
        if (s) s.classList.remove("active", "completed");
      }
    }

    _waitForKeyboardReconnect(timeoutMs = 20000) {
      return new Promise((resolve) => {
        if (window.gProtocol && window.gProtocol.isConnected) {
          return resolve(true);
        }

        const startTime = Date.now();
        const checkInterval = setInterval(async () => {
          if (window.gProtocol && window.gProtocol.isConnected) {
            clearInterval(checkInterval);
            return resolve(true);
          }

          // Try automatic reconnection if device manager exists
          if (window.deviceManager && typeof window.deviceManager.connectAutoOrPrompt === "function") {
            try {
              const connected = await window.deviceManager.connectAutoOrPrompt(true);
              if (connected) {
                clearInterval(checkInterval);
                return resolve(true);
              }
            } catch (e) {}
          }

          if (Date.now() - startTime > timeoutMs) {
            clearInterval(checkInterval);
            return resolve(false);
          }
        }, 1000);
      });
    }
  }

  window.FirmwareFlasher = FirmwareFlasher;
})();
