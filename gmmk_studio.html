    usage: 0x61,
    rows: 14,
    cols: 8,
    layers: 3
  };

  class GMMK3Protocol {
    constructor() {
      this.device = null;
      this.onLog = null;
      this.onDisconnect = null;
      this.onDevicesChanged = null;
      this._lock = Promise.resolve();
      this._pending = null;
      this._reportListener = this._handleInputReport.bind(this);
      this.initHIDListeners();
    }

    initHIDListeners() {
      if (typeof navigator !== 'undefined' && navigator.hid) {
        navigator.hid.addEventListener('disconnect', (event) => {
          if (this.device && event.device === this.device) {
            this.cleanup();
            if (this.onDisconnect) {
              this.onDisconnect(event.device);
            }
          }
          if (this.onDevicesChanged) {
            this.onDevicesChanged();
          }
        });

        navigator.hid.addEventListener('connect', (event) => {
          if (this.onDevicesChanged) {
            this.onDevicesChanged();
          }
        });
      }
    }

    _handleInputReport(event) {
      if (!this._pending) return;

      const data = new Uint8Array(event.data.buffer, event.data.byteOffset, event.data.byteLength);
      const req = this._pending;

      if (typeof req.predicate === "function") {
        if (!req.predicate(data)) {
          return;
        }
      }

      if (req.timer) clearTimeout(req.timer);
      this._pending = null;
      req.resolve(data);
    }

    cleanup() {
      if (this.device) {
        try {
          this.device.removeEventListener('inputreport', this._reportListener);
        } catch (e) { }
      }
      if (this._pending) {
        if (this._pending.timer) clearTimeout(this._pending.timer);
        if (typeof this._pending.reject === 'function') {
          this._pending.reject(new Error("Device disconnected"));
        }
      }
      this._pending = null;
      this.device = null;
      this._lock = Promise.resolve();
    }

    log(msg, type = 'info') {
      if (this.onLog) {
        this.onLog(msg, type);
      }
    }

    get isConnected() {
      return this.device !== null && this.device.opened;
    }

    isRawHID(d) {
      if (!d || !d.collections || d.collections.length === 0) return false;
      return d.collections.some(c => c.usagePage === 0xFF60);
    }

    isDedicatedRawHID(d) {
      if (!d || !d.collections || d.collections.length === 0) return false;
      const hasRaw = d.collections.some(c => c.usagePage === 0xFF60 && (c.usage === 0x61 || c.usage === 0x01));
      const hasOSInterface = d.collections.some(c => c.usagePage === 0x01 || c.usagePage === 0x0C);
      return hasRaw && !hasOSInterface;
    }

    isSameDevice(d1, d2) {
      if (!d1 || !d2) return false;
      if (d1 === d2) return true;
      const v1 = d1.vendorId || 0;
      const p1 = d1.productId || 0;
      const v2 = d2.vendorId || 0;
      const p2 = d2.productId || 0;
      if (v1 !== v2 || p1 !== p2) return false;
      const s1 = (d1.serialNumber && String(d1.serialNumber).trim()) ? String(d1.serialNumber).trim() : null;
      const s2 = (d2.serialNumber && String(d2.serialNumber).trim()) ? String(d2.serialNumber).trim() : null;
      if (s1 && s2) return s1 === s2;
      return true;
    }

    getUniqueDevices(devices) {
      if (!Array.isArray(devices)) return [];
      const unique = [];
      for (const d of devices) {
        if (!unique.some(u => this.isSameDevice(u, d))) {
          unique.push(d);
        }
      }
      return unique;
    }

    getDeviceId(d, index = 0) {
      if (!d) return "";
      const v = (d.vendorId || 0).toString(16).padStart(4, "0");
      const p = (d.productId || 0).toString(16).padStart(4, "0");
      const s = d.serialNumber || index.toString();
      return `${v}:${p}:${s}`;
    }

    async getAuthorizedDevices() {
      if (!navigator.hid) return [];
      try {
        const devices = await navigator.hid.getDevices();
        // Return only Raw HID devices
        return devices.filter(d => this.isRawHID(d));
      } catch (e) {
        return [];
      }
    }

    async connectDevice(targetDevice) {
      if (!targetDevice) {
        throw new Error(window.i18n ? window.i18n.t("optNoDevices") : "No device specified");
      }

      if (this.device && this.device !== targetDevice) {
        try {
          if (this.device.opened) {
            await this.device.close();
          }
        } catch (e) { }
      }

      this.cleanup();
      this.device = targetDevice;

      if (!this.device.opened) {
        await this.device.open();
      }

      this.device.addEventListener('inputreport', this._reportListener);
      const name = this.device.productName || "LuxQMK Keyboard";
      const msg = window.i18n ? window.i18n.t("logConnectedDevice", { name }) : `Connected to device: ${name} (0xFF60:0x61)`;
      this.log(msg, 'info');
      return this.device;
    }

    async autoConnect(savedId = null) {
      const devices = await this.getAuthorizedDevices();
      if (devices.length === 0) return null;

      let target = null;
      if (savedId) {
        target = devices.find((d, idx) => this.getDeviceId(d, idx) === savedId);
      }

      if (!target) {
        // Find best dedicated Raw HID device
        target = devices.find(d => this.isDedicatedRawHID(d)) || devices[0];
      }

      if (target) {
        return await this.connectDevice(target);
      }
      return null;
    }

    async requestAndConnect() {
      if (!navigator.hid) {
        throw new Error(window.i18n ? window.i18n.t("errorWebHidNotSupported") : "WebHID is not supported in this browser");
      }

      const devices = await navigator.hid.requestDevice({
        filters: [
          { usagePage: 0xFF60, usage: 0x61 },
          { usagePage: 0xFF60 }
        ]
      });

      if (!devices || devices.length === 0) {
        throw new Error(window.i18n ? window.i18n.t("logDeviceCancelled") : "Device selection cancelled");
      }

      const target = devices.find(d => this.isDedicatedRawHID(d)) || devices[0];
      return await this.connectDevice(target);
    }

    async disconnect() {
      if (this.device) {
        try {
          if (this.device.opened) {
            await this.device.close();
          }
        } catch (e) { }
      }
      this.cleanup();
      const msg = window.i18n ? window.i18n.t("logDisconnected") : "Keyboard disconnected";
      this.log(msg, "warning");
    }

    async sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    /**
     * Sequential execution of HID transactions protected by a robust mutex queue
     */
    async sendCommand(bytes, timeoutMs = 2500, retries = 2, predicate = null) {
      const currentAction = async () => {
        if (!this.device || !this.device.opened) {
          throw new Error("Device is not opened or disconnected");
        }

        const report = new Uint8Array(32);
        for (let i = 0; i < Math.min(bytes.length, 32); i++) {
          report[i] = bytes[i];
        }

        const checkMatch = predicate || ((data) => {
          return data[0] === bytes[0] || data[0] === 0xFF;
        });

        for (let attempt = 0; attempt <= retries; attempt++) {
          try {
            if (this._pending && this._pending.timer) {
              clearTimeout(this._pending.timer);
            }
            this._pending = null;

            const responsePromise = new Promise((resolve, reject) => {
              const timer = setTimeout(() => {
                if (this._pending && this._pending.resolve === resolve) {
                  this._pending = null;
                }
                reject(new Error(`HID response timeout after ${timeoutMs}ms (CMD 0x${bytes[0].toString(16)})`));
              }, timeoutMs);

              this._pending = { resolve, reject, timer, predicate: checkMatch };
            });

            await this.device.sendReport(0x00, report);
            const responseData = await responsePromise;
            return responseData;
          } catch (err) {
            if (attempt === retries) {
              throw err;
            }
            await this.sleep(40);
          }
        }
      };

      const nextPromise = this._lock.catch(() => { }).then(currentAction);
      this._lock = nextPromise.catch(() => { });
      return nextPromise;
    }

    // --- VIA Core Methods ---
    async getProtocolVersion() {
      const res = await this.sendCommand([VIA_CMD.GET_PROTOCOL_VERSION]);
      return (res[1] << 8) | res[2];
    }

    async getKeycode(layer, row, col) {
      const res = await this.sendCommand([VIA_CMD.DYNAMIC_KEYMAP_GET_KEYCODE, layer, row, col]);
      return (res[4] << 8) | res[5];
    }

    async setKeycode(layer, row, col, keycode) {
      const hi = (keycode >> 8) & 0xFF;
      const lo = keycode & 0xFF;
      return await this.sendCommand([VIA_CMD.DYNAMIC_KEYMAP_SET_KEYCODE, layer, row, col, hi, lo]);
    }

    async getKeymapBuffer(offset, size) {
      const offHi = (offset >> 8) & 0xFF;
      const offLo = offset & 0xFF;
      return await this.sendCommand([VIA_CMD.DYNAMIC_KEYMAP_GET_BUFFER, offHi, offLo, size]);
    }

    async readFullKeymap(layers = 3, rows = 14, cols = 8) {
      const totalBytes = layers * rows * cols * 2;
      const fullBuffer = new Uint8Array(totalBytes);
      const CHUNK_SIZE = 28;
      for (let offset = 0; offset < totalBytes; offset += CHUNK_SIZE) {
        const size = Math.min(CHUNK_SIZE, totalBytes - offset);
        const res = await this.getKeymapBuffer(offset, size);
        for (let i = 0; i < size; i++) {
          fullBuffer[offset + i] = res[4 + i];
        }
      }
      return fullBuffer;
    }

    async setKeymapBuffer(offset, size, bytes) {
      const offHi = (offset >> 8) & 0xFF;
      const offLo = offset & 0xFF;
      const payload = [VIA_CMD.DYNAMIC_KEYMAP_SET_BUFFER, offHi, offLo, size, ...bytes];
      return await this.sendCommand(payload);
    }

    async writeFullKeymap(layers, rows = 14, cols = 8, onProgress = null) {
      const totalLayers = Math.min(layers.length, 3);
      const totalBytes = totalLayers * rows * cols * 2;
      const fullBuffer = new Uint8Array(totalBytes);
      for (let l = 0; l < totalLayers; l++) {
        const layer = layers[l];
        if (!layer) continue;
        for (let r = 0; r < rows && r < layer.length; r++) {
          const row = layer[r];
          if (!row) continue;
          for (let c = 0; c < cols && c < row.length; c++) {
            const kc = row[c] ?? 0;
            const byteIdx = (l * rows * cols * 2) + (r * cols * 2) + (c * 2);
            fullBuffer[byteIdx] = (kc >> 8) & 0xFF;
            fullBuffer[byteIdx + 1] = kc & 0xFF;
          }
        }
      }

      const CHUNK_SIZE = 28;
      for (let offset = 0; offset < totalBytes; offset += CHUNK_SIZE) {
        const size = Math.min(CHUNK_SIZE, totalBytes - offset);
        const chunk = Array.from(fullBuffer.slice(offset, offset + size));
        await this.setKeymapBuffer(offset, size, chunk);
        if (onProgress) {
          onProgress(Math.round(((offset + size) / totalBytes) * 100));
        }
        await this.sleep(2);
      }
    }

    // --- Rotary Knob Encoders ---
    async getEncoder(layer, id = 0, isClockwise = false) {
      const res = await this.sendCommand([VIA_CMD.DYNAMIC_KEYMAP_GET_ENCODER, layer, id, isClockwise ? 1 : 0]);
      return (res[4] << 8) | res[5];
    }

    async setEncoder(layer, id = 0, isClockwise = false, keycode = 0) {
      const hi = (keycode >> 8) & 0xFF;
      const lo = keycode & 0xFF;
      return await this.sendCommand([VIA_CMD.DYNAMIC_KEYMAP_SET_ENCODER, layer, id, isClockwise ? 1 : 0, hi, lo]);
    }

    // --- Dynamic Macro Methods ---
    async getMacroCount() {
      const res = await this.sendCommand([VIA_CMD.MACRO_GET_COUNT]);
      return res[1];
    }

    async getMacroBufferSize() {
      const res = await this.sendCommand([VIA_CMD.MACRO_GET_BUFFER_SIZE]);
      return (res[1] << 8) | res[2];
    }

    async getMacroBuffer() {
      try {
        const totalSize = await this.getMacroBufferSize();
        if (!totalSize || totalSize > 4096) {
          return { bufferSize: 0, data: [] };
        }
        const data = [];
        const CHUNK_SIZE = 28;
        for (let offset = 0; offset < totalSize; offset += CHUNK_SIZE) {
          const size = Math.min(CHUNK_SIZE, totalSize - offset);
          const offHi = (offset >> 8) & 0xFF;
          const offLo = offset & 0xFF;
          const res = await this.sendCommand([VIA_CMD.MACRO_GET_BUFFER, offHi, offLo, size]);
          for (let i = 0; i < size; i++) {
            data.push(res[4 + i]);
          }
        }
        return { bufferSize: totalSize, data };
      } catch (e) {
        return { bufferSize: 0, data: [] };
      }
    }

    async setMacroBuffer(macroObj) {
      if (!macroObj || !Array.isArray(macroObj.data) || macroObj.data.length === 0) return;
      const data = macroObj.data;
      const totalSize = data.length;
      const CHUNK_SIZE = 28;
      for (let offset = 0; offset < totalSize; offset += CHUNK_SIZE) {
        const size = Math.min(CHUNK_SIZE, totalSize - offset);
        const offHi = (offset >> 8) & 0xFF;
        const offLo = offset & 0xFF;
        const chunk = data.slice(offset, offset + size);
        const payload = [VIA_CMD.MACRO_SET_BUFFER, offHi, offLo, size, ...chunk];
        await this.sendCommand(payload);
        await this.sleep(4);
      }
    }

    async resetMacros() {
      return await this.sendCommand([VIA_CMD.MACRO_RESET]);
    }

    // --- Monochromatic Backlight Standard Channel (Channel 2) ---
    async getBacklightValue(valueId) {
      return await this.sendCommand([VIA_CMD.CUSTOM_GET_VALUE, CHANNELS.BACKLIGHT, valueId]);
    }

    async setBacklightValue(valueId, ...args) {
      return await this.sendCommand([VIA_CMD.CUSTOM_SET_VALUE, CHANNELS.BACKLIGHT, valueId, ...args]);
    }

    // --- RGB Matrix Standard Channel (Channel 3) ---
    async getRGBMatrixValue(valueId) {
      return await this.sendCommand([VIA_CMD.CUSTOM_GET_VALUE, CHANNELS.RGB_MATRIX, valueId]);
    }

    async setRGBMatrixValue(valueId, ...args) {
      return await this.sendCommand([VIA_CMD.CUSTOM_SET_VALUE, CHANNELS.RGB_MATRIX, valueId, ...args]);
    }

    // --- Custom Channel (Channel 1) ---
    async getCustomValue(channel, valueId, ...args) {
      const predicate = (data) => {
        return (data[0] === VIA_CMD.CUSTOM_GET_VALUE && data[1] === channel && data[2] === valueId) || data[0] === 0xFF;
      };
      try {
        const res = await this.sendCommand([VIA_CMD.CUSTOM_GET_VALUE, channel, valueId, ...args], 600, 1, predicate);
        if (!res || res[0] === 0xFF || res[1] !== channel || res[2] !== valueId) {
          return null;
        }
        return res;
      } catch (e) {
        return null;
      }
    }

    async setCustomValue(channel, valueId, ...args) {
      return await this.sendCommand([VIA_CMD.CUSTOM_SET_VALUE, channel, valueId, ...args], 600, 1);
    }

    async saveCustomConfig(channel = CHANNELS.CUSTOM) {
      return await this.sendCommand([VIA_CMD.CUSTOM_SAVE, channel]);
    }

    async reloadEEPROM(channel = CHANNELS.CUSTOM) {
      try {
        await this.setCustomValue(channel, CUSTOM_VAL.RELOAD_EEPROM, 1);
      } catch (e) {
        console.warn("Could not send reloadEEPROM to device:", e);
      }
    }

    async getActiveLayer() {
      const res = await this.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.ACTIVE_LAYER);
      if (!res || res[0] === 0xFF || res[1] !== CHANNELS.CUSTOM || res[2] !== CUSTOM_VAL.ACTIVE_LAYER) {
        return undefined;
      }
      return res[3];
    }

    async getHostLeds() {
      const res = await this.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.HOST_LEDS);
      if (!res || res[0] === 0xFF || res[1] !== CHANNELS.CUSTOM || res[2] !== CUSTOM_VAL.HOST_LEDS) {
        return null;
      }
      return {
        caps: res[3] === 1,
        num: res[4] === 1,
        scroll: res[5] === 1
      };
    }

    async getFirmwareVersion() {
      try {
        const res = await this.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.LUXQMK_VERSION);
        if (!res || res[0] === 0xFF || res[1] !== CHANNELS.CUSTOM || res[2] !== CUSTOM_VAL.LUXQMK_VERSION) {
          return { major: 0, minor: 0, patch: 0, versionString: "Legacy / Generic VIA", capabilities: {} };
        }
        const major = res[3];
        const minor = res[4];
        const patch = res[5];
        const capFlags = (res[6] || 0) | ((res[7] || 0) << 8);
        return {
          major,
          minor,
          patch,
          versionString: `v${major}.${minor}.${patch}`,
          capabilities: {
            reactiveOverlay: (capFlags & 0x01) !== 0,
            directionReverse: (capFlags & 0x02) !== 0,
            logoBadgeLed: (capFlags & 0x04) !== 0,
            winLock: (capFlags & 0x08) !== 0,
            layerLighting: (capFlags & 0x10) !== 0,
            heatmap: (capFlags & 0x20) !== 0,
            directLighting: (capFlags & 0x40) !== 0,
            multiGradients: (capFlags & 0x80) !== 0,
            sidelights: (capFlags & 0x100) !== 0 || (major > 0 || minor >= 3),
            perKeyProfiles: (capFlags & 0x200) !== 0 || (major > 0 || minor > 2 || (minor === 2 && patch >= 1))
          }
        };
      } catch (e) {
        return { major: 0, minor: 0, patch: 0, versionString: "Legacy / Generic VIA", capabilities: {} };
      }
    }

    async getQMKVersion() {
      try {
        const res = await this.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.QMK_VERSION);
        if (!res || res[0] === 0xFF || res[1] !== CHANNELS.CUSTOM || res[2] !== CUSTOM_VAL.QMK_VERSION) {
          return "QMK";
        }
        let str = "";
        for (let i = 3; i < res.length; i++) {
          if (res[i] === 0) break;
          str += String.fromCharCode(res[i]);
        }
        return str.trim() || "QMK";
      } catch (e) {
        return "QMK";
      }
    }

    async getDebounceTime() {
      try {
        const res = await this.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.DEBOUNCE_TIME);
        if (!res || res[0] === 0xFF || res[1] !== CHANNELS.CUSTOM || res[2] !== CUSTOM_VAL.DEBOUNCE_TIME) {
          return 5;
        }
        return res[3];
      } catch (e) {
        return 5;
      }
    }

    async setDebounceTime(ms) {
      const num = parseInt(ms, 10);
      const val = (!isNaN(num) && num >= 0 && num <= 30) ? num : 5;
      await this.setCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.DEBOUNCE_TIME, val);
    }

    async resetEEPROM() {
      if (!this.isConnected) throw new Error("Device not connected");
      this.log("Sending EEPROM factory reset command (VIA DYNAMIC_KEYMAP_RESET)...", "warning");
      try {
        await this.sendCommand([VIA_CMD.DYNAMIC_KEYMAP_RESET]);
        this.log("EEPROM factory reset command sent successfully", "success");
      } catch (e) {
        this.log("EEPROM reset error: " + e.message, "error");
        throw e;
      }
    }

    async jumpToBootloader() {
      // 1. VIA Standard Bootloader Jump command (0x0B = id_bootloader_jump)
      try {
        await this.sendCommand([0x0B]);
      } catch (e) { }

      // 2. LuxQMK Custom Bootloader Jump command (Channel 0x01, Val 0xFE)
      try {
        await this.sendCommand([VIA_CMD.CUSTOM_SET_VALUE, CHANNELS.CUSTOM, CUSTOM_VAL.BOOTLOADER_JUMP, 0x01]);
      } catch (e) { }
    }

    // --- Direct Software Live Lighting Streaming ---
    async setDirectLightingEnable(enable) {
      if (!this.isConnected) return;
      try {
        await this.sendCommand([VIA_CMD.CUSTOM_SET_VALUE, CHANNELS.CUSTOM, CUSTOM_VAL.DIRECT_LIGHTING_ENABLE, enable ? 1 : 0]);
      } catch (e) { }
    }

    async sendDirectLightingBlock(startIdx, rgbTriplets) {
      if (!this.device || !this.device.opened || !rgbTriplets || rgbTriplets.length === 0) return;
      const count = Math.floor(rgbTriplets.length / 3);
      const report = new Uint8Array(32);
      report[0] = VIA_CMD.CUSTOM_SET_VALUE;
      report[1] = CHANNELS.CUSTOM;
      report[2] = CUSTOM_VAL.DIRECT_LIGHTING_BLOCK;
      report[3] = startIdx;
      report[4] = count;
      for (let i = 0; i < rgbTriplets.length && (5 + i) < 32; i++) {
        report[5 + i] = rgbTriplets[i];
      }
      try {
        await this.device.sendReport(0x00, report);
      } catch (e) { }
    }

    // --- Per-Key Hardware RGB Profiles (Profile 1: FPS, Profile 2: MOBA, Profile 3: MMO) ---
    async getPerKeyProfile(profileIdx = 0, totalLeds = 144) {
      if (!this.isConnected) return null;
      const CHUNK_LEDS = 8;
      const rgbArray = [];
      const safeTotal = Math.min(144, Math.max(1, totalLeds));

      for (let startLed = 0; startLed < safeTotal; startLed += CHUNK_LEDS) {
        const count = Math.min(CHUNK_LEDS, safeTotal - startLed);
        try {
          const res = await this.getCustomValue(CHANNELS.CUSTOM, CUSTOM_VAL.PERKEY_PROFILE_GET_BLOCK, profileIdx, startLed, count);
          if (res && res.length >= 6 + (count * 3)) {
            for (let i = 0; i < count; i++) {
              rgbArray.push({
                r: res[6 + (i * 3) + 0],
                g: res[6 + (i * 3) + 1],
                b: res[6 + (i * 3) + 2]
              });
            }
          } else {
            for (let i = 0; i < count; i++) {
              rgbArray.push({ r: 0, g: 0, b: 0 });
            }
          }
        } catch (e) {
          for (let i = 0; i < count; i++) {
            rgbArray.push({ r: 0, g: 0, b: 0 });
          }
        }
      }
      return rgbArray;
    }

    async setPerKeyProfileBlock(profileIdx, startIdx, rgbData) {
      if (!this.device || !this.device.opened || !rgbData || rgbData.length === 0) return;
      let triplets = [];
      let count = 0;
      if (typeof rgbData[0] === 'object' && rgbData[0] !== null) {
        count = Math.min(8, rgbData.length);
        for (let i = 0; i < count; i++) {
          const c = rgbData[i] || { r: 0, g: 0, b: 0 };
          triplets.push(c.r ?? 0, c.g ?? 0, c.b ?? 0);
        }
      } else {
        count = Math.min(8, Math.floor(rgbData.length / 3));
        triplets = rgbData.slice(0, count * 3);
      }

      const payload = [
        VIA_CMD.CUSTOM_SET_VALUE,
        CHANNELS.CUSTOM,
        CUSTOM_VAL.PERKEY_PROFILE_SET_BLOCK,
        profileIdx,
        startIdx,
        count,
        ...triplets
      ];
      try {
        await this.sendCommand(payload, 300, 1);
      } catch (e) { }
    }

    async setFullPerKeyProfile(profileIdx, rgbArray) {
      if (!this.isConnected || !Array.isArray(rgbArray) || rgbArray.length === 0) return;
      const CHUNK_LEDS = 8;
      const totalLeds = Math.min(144, rgbArray.length);

      for (let startLed = 0; startLed < totalLeds; startLed += CHUNK_LEDS) {
        const count = Math.min(CHUNK_LEDS, totalLeds - startLed);
        const triplets = [];
        for (let i = 0; i < count; i++) {
          const c = rgbArray[startLed + i] || { r: 0, g: 0, b: 0 };
          triplets.push(c.r || 0, c.g || 0, c.b || 0);
        }
        await this.setPerKeyProfileBlock(profileIdx, startLed, triplets);
        await this.sleep(4);
      }
    }

    async savePerKeyProfileToEEPROM(profileIdx = 0xFF) {

      try {
        await this.sendCommand([

          CUSTOM_VAL.PERKEY_PROFILE_SAVE_EEPROM,

        ], 1000, 1);

        return {
          enable: (enRes && enRes[0] !== 0xFF && enRes[1] === CHANNELS.CUSTOM && enRes[2] === CUSTOM_VAL.SIDELIGHT_ENABLE) ? (enRes[3] === 1) : false,
          mode: (modeRes && modeRes[0] !== 0xFF && modeRes[1] === CHANNELS.CUSTOM && modeRes[2] === CUSTOM_VAL.SIDELIGHT_MODE) ? modeRes[3] : 0,
          hue: (colorRes && colorRes[0] !== 0xFF && colorRes[1] === CHANNELS.CUSTOM && colorRes[2] === CUSTOM_VAL.SIDELIGHT_COLOR) ? colorRes[3] : 0,
          sat: (colorRes && colorRes[0] !== 0xFF && colorRes[1] === CHANNELS.CUSTOM && colorRes[2] === CUSTOM_VAL.SIDELIGHT_COLOR) ? colorRes[4] : 255,
          speed: (speedRes && speedRes[0] !== 0xFF && speedRes[1] === CHANNELS.CUSTOM && speedRes[2] === CUSTOM_VAL.SIDELIGHT_SPEED) ? speedRes[3] : 128,
          gradient: (gradRes && gradRes[0] !== 0xFF && gradRes[1] === CHANNELS.CUSTOM && gradRes[2] === CUSTOM_VAL.SIDELIGHT_GRADIENT) ? gradRes[3] : 0,
          reverse: (revRes && revRes[0] !== 0xFF && revRes[1] === CHANNELS.CUSTOM && revRes[2] === CUSTOM_VAL.SIDELIGHT_REVERSE) ? (revRes[3] === 1) : false,
          density: (densRes && densRes[0] !== 0xFF && densRes[1] === CHANNELS.CUSTOM && densRes[2] === CUSTOM_VAL.SIDELIGHT_DENSITY) ? (densRes[3] || 128) : 128
        };
      } catch (e) {
        return null;
      }
    }

    async setSidelightEnable(enable) {
      if (!this.isConnected) return;
      try {
        await this.sendCommand([VIA_CMD.CUSTOM_SET_VALUE, CHANNELS.CUSTOM, CUSTOM_VAL.SIDELIGHT_ENABLE, enable ? 1 : 0]);

        await this.sendCommand([VIA_CMD.CUSTOM_SET_VALUE, CHANNELS.CUSTOM, CUSTOM_VAL.SIDELIGHT_MODE, mode]);
      } catch (e) { }

    async setSidelightColor(h, s) {

      try {
        await this.sendCommand([VIA_CMD.CUSTOM_SET_VALUE, CHANNELS.CUSTOM, CUSTOM_VAL.SIDELIGHT_COLOR, h, s]);
      } catch (e) { }
    }

    async setSidelightSpeed(speed) {

      try {
        await this.sendCommand([VIA_CMD.CUSTOM_SET_VALUE, CHANNELS.CUSTOM, CUSTOM_VAL.SIDELIGHT_SPEED, speed]);

  };

  class GradientEditor {
    constructor(container, options = {}) {
      this.container = typeof container === "string" ? document.getElementById(container) : container;
      this.options = Object.assign({
        maxStops: 8,
        minStops: 2,
        onChange: null,
        stops: [
          { pos: 0, r: 0, g: 255, b: 255 },
          { pos: 85, r: 255, g: 0, b: 128 },
          { pos: 170, r: 255, g: 255, b: 0 }
        ]
      }, options);

      this.stops = JSON.parse(JSON.stringify(this.options.stops));
      this.activeStopIndex = 0;
      this._isDragging = false;
      this._dragIndex = -1;

      if (this.container) {
        this.init();
      }
    }

    init() {
      this.container.innerHTML = "";
      this.container.className = "gradient-editor-widget";

      // 1. Interactive Gradient Track Wrapper
      const trackWrap = document.createElement("div");
      trackWrap.className = "gradient-track-wrap";
      trackWrap.innerHTML = `
        <div class="gradient-track-label-bar">
          <span class="gradient-track-title" data-i18n="lblGradientEditor">Multi-Stop Gradient Ramp</span>

      `;
      this.container.appendChild(trackWrap);

      // 2. Active Stop Controls Toolbar
      const controlsBar = document.createElement("div");
      controlsBar.className = "gradient-stop-controls-bar";
      controlsBar.innerHTML = `
        <div class="gradient-stop-control-item">
          <label data-i18n="lblActiveStopColor">Stop Color</label>
          <div class="color-input-wrap">
            <input type="color" id="gradientActiveColorPicker" class="color-picker-input" value="#00ffff">
            <input type="text" id="gradientActiveHexInput" class="form-control font-mono" style="width: 90px; text-transform: uppercase;" value="#00FFFF" maxlength="7">
          </div>
        </div>
        <div class="gradient-stop-control-item" style="flex: 1; min-width: 160px;">
          <div style="display: flex; justify-content: space-between;">
            <label data-i18n="lblActiveStopPosition">Stop Position</label>
            <span id="gradientActivePosLabel" class="font-mono text-cyan">0%</span>
          </div>
          <div class="range-slider-wrap">
            <input type="range" id="gradientActivePosSlider" class="range-slider" min="0" max="100" step="1" value="0">
          </div>
        </div>
        <div class="gradient-stop-control-actions">
          <button type="button" class="btn btn-secondary btn-sm" id="gradientAddStopBtn" title="Add Stop" style="display: inline-flex; align-items: center; gap: 6px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span data-i18n="btnAddStop">Add Stop</span>
          </button>
          <button type="button" class="btn btn-danger btn-sm" id="gradientDeleteStopBtn" title="Delete Stop" style="display: inline-flex; align-items: center; gap: 6px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            <span data-i18n="btnDeleteStop">Remove</span>
          </button>
        </div>
      `;
      this.container.appendChild(controlsBar);

      // 3. Preset Quick-Picks Toolbar
      const presetsBar = document.createElement("div");
      presetsBar.className = "gradient-presets-bar";
      presetsBar.innerHTML = `
        <span class="presets-bar-title" data-i18n="lblGradientPresets">Presets:</span>
        <div class="gradient-preset-pills">
          <button type="button" class="preset-pill" data-preset="rainbow">Rainbow</button>
          <button type="button" class="preset-pill" data-preset="cyberpunk">Cyberpunk</button>
          <button type="button" class="preset-pill" data-preset="synthwave">Synthwave</button>
          <button type="button" class="preset-pill" data-preset="sunset">Sunset</button>
          <button type="button" class="preset-pill" data-preset="toxic_lime">Toxic Lime</button>
          <button type="button" class="preset-pill" data-preset="ocean">Ocean</button>
          <button type="button" class="preset-pill" data-preset="fire_ice">Fire & Ice</button>
          <button type="button" class="preset-pill" data-preset="pastel">Pastel</button>
        </div>
      `;
      this.container.appendChild(presetsBar);

      this._cacheElements();
      this._bindEvents();
      this.render();
    }

    _cacheElements() {
      this.trackArea = this.container.querySelector("#gradientTrackArea");
      this.trackBar = this.container.querySelector("#gradientTrackBar");
      this.pinsLayer = this.container.querySelector("#gradientPinsLayer");
      this.colorPicker = this.container.querySelector("#gradientActiveColorPicker");
      this.hexInput = this.container.querySelector("#gradientActiveHexInput");
      this.posSlider = this.container.querySelector("#gradientActivePosSlider");
      this.posLabel = this.container.querySelector("#gradientActivePosLabel");
      this.addBtn = this.container.querySelector("#gradientAddStopBtn");
      this.delBtn = this.container.querySelector("#gradientDeleteStopBtn");
    }

    _bindEvents() {
      // 1. Click track to add stop
      this.trackArea.addEventListener("click", (e) => {
        if (e.target.closest(".gradient-pin")) return; // Clicked existing pin
        if (this.stops.length >= this.options.maxStops) return;

        const rect = this.trackArea.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const norm = Math.max(0, Math.min(1, clickX / rect.width));
        const pos255 = Math.round(norm * 255);

        // Sample color at click position
        const sampledRgb = this.sampleAt(pos255);
        this.stops.push({
          pos: pos255,
          r: sampledRgb[0],
          g: sampledRgb[1],
          b: sampledRgb[2]
        });
        this.stops.sort((a, b) => a.pos - b.pos);
        this.activeStopIndex = this.stops.findIndex(s => s.pos === pos255);
        this.render();
        this._emitChange();
      });

      // 2. Drag-and-drop pins
      const onMove = (e) => {
        if (!this._isDragging || this._dragIndex < 0) return;
        const rect = this.trackArea.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const norm = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        const newPos = Math.round(norm * 255);

        this.stops[this._dragIndex].pos = newPos;

        // Fast update single pin DOM
        const pinEl = this.pinsLayer.querySelector(`.gradient-pin[data-index="${this._dragIndex}"]`);
        if (pinEl) {
          const pct = ((newPos / 255) * 100).toFixed(2);
          pinEl.style.left = `${pct}%`;
          const tooltip = pinEl.querySelector(".pin-tooltip");
          if (tooltip) tooltip.textContent = `${Math.round((newPos / 255) * 100)}%`;
        }

        // Update track gradient background
        if (this.trackBar) {
          this.trackBar.style.background = this.toCssLinearGradient();
        }

        // Fast update position controls
        const pct = Math.round((newPos / 255) * 100);
        if (this.posSlider) this.posSlider.value = String(pct);
        if (this.posLabel) this.posLabel.textContent = `${pct}%`;

        this._emitChange();
      };

      const onUp = () => {
        if (this._isDragging) {
          this._isDragging = false;
          const cur = this.stops[this._dragIndex];
          this.stops.sort((a, b) => a.pos - b.pos);
          if (cur) {
            this.activeStopIndex = this.stops.indexOf(cur);
          }
          this._dragIndex = -1;
          this.render();
          this._emitChange();
        }
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("mouseup", onUp);
        window.removeEventListener("touchmove", onMove);
        window.removeEventListener("touchend", onUp);
      };

      this.pinsLayer.addEventListener("mousedown", (e) => {
        const pin = e.target.closest(".gradient-pin");
        if (!pin) return;
        const idx = parseInt(pin.dataset.index, 10);
        if (isNaN(idx)) return;
        this.activeStopIndex = idx;
        this._isDragging = true;
        this._dragIndex = idx;
        this.render();

        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      });

      this.pinsLayer.addEventListener("touchstart", (e) => {
        const pin = e.target.closest(".gradient-pin");
        if (!pin) return;
        const idx = parseInt(pin.dataset.index, 10);
        if (isNaN(idx)) return;
        this.activeStopIndex = idx;
        this._isDragging = true;
        this._dragIndex = idx;
        this.render();

        window.addEventListener("touchmove", onMove, { passive: false });
        window.addEventListener("touchend", onUp);
      });

      // 3. Color picker & Hex input
      const updateColor = (hex) => {
        const stop = this.stops[this.activeStopIndex];
        if (!stop) return;
        const rgb = this._hexToRgb(hex);
        stop.r = rgb[0];
        stop.g = rgb[1];
        stop.b = rgb[2];
        this.render();
        this._emitChange();
      };

      this.colorPicker.addEventListener("input", (e) => {
        this.hexInput.value = e.target.value.toUpperCase();
        updateColor(e.target.value);
      });
      this.colorPicker.addEventListener("change", (e) => {
        this.hexInput.value = e.target.value.toUpperCase();
        updateColor(e.target.value);
      });

      this.hexInput.addEventListener("input", (e) => {
        let val = e.target.value.trim();
        if (!val.startsWith("#")) val = "#" + val;
        if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
          this.colorPicker.value = val;
          updateColor(val);
        }
      });

      // 4. Position Slider
      this.posSlider.addEventListener("input", (e) => {
        const stop = this.stops[this.activeStopIndex];
        if (!stop) return;
        const pct = parseInt(e.target.value, 10);
        stop.pos = Math.round((pct / 100) * 255);
        this.posLabel.textContent = `${pct}%`;
        this.render();
        this._emitChange();
      });

      this.posSlider.addEventListener("change", () => {
        const cur = this.stops[this.activeStopIndex];
        this.stops.sort((a, b) => a.pos - b.pos);
        if (cur) {
          this.activeStopIndex = this.stops.indexOf(cur);
        }
        this.render();
        this._emitChange();
      });

      // 5. Add Stop Button
      this.addBtn.addEventListener("click", () => {
        if (this.stops.length >= this.options.maxStops) return;
        let newPos = 128;
        if (this.stops.length > 0) {
          const cur = this.stops[this.activeStopIndex] || this.stops[0];
          newPos = Math.min(255, cur.pos + 30);
          if (newPos > 255) newPos = Math.max(0, cur.pos - 30);
        }
        const sampled = this.sampleAt(newPos);
        this.stops.push({ pos: newPos, r: sampled[0], g: sampled[1], b: sampled[2] });
        this.stops.sort((a, b) => a.pos - b.pos);
        this.activeStopIndex = this.stops.findIndex(s => s.pos === newPos);
        this.render();
        this._emitChange();
      });

      // 6. Delete Stop Button
      this.delBtn.addEventListener("click", () => {
        if (this.stops.length <= this.options.minStops) return;
        this.stops.splice(this.activeStopIndex, 1);
        if (this.activeStopIndex >= this.stops.length) {
          this.activeStopIndex = this.stops.length - 1;
        }
        this.render();
        this._emitChange();
      });

      // 7. Preset Pills
      this.container.querySelectorAll(".preset-pill").forEach((pill) => {
        pill.addEventListener("click", () => {
          const pKey = pill.dataset.preset;
          if (PRESET_GRADIENTS[pKey]) {
            this.setStops(PRESET_GRADIENTS[pKey].stops, true);
          }
        });
      });

      // 8. Deselect active pin when clicking anywhere outside this gradient editor widget
      document.addEventListener("pointerdown", (e) => {
        if (!this.container || !this.container.isConnected) return;
        if (!this.container.contains(e.target)) {
          if (this.activeStopIndex !== -1) {
            this.activeStopIndex = -1;
            this.renderPinsOnly();
            this._updateControlsUI();
          }
        }
      });
    }

    render() {
      if (!this.trackBar || !this.pinsLayer) return;

      // Update Track Bar Background (CSS linear-gradient)
      const gradientCss = this.toCssLinearGradient();
      this.trackBar.style.background = gradientCss;

      // Render Pins
      this.renderPinsOnly();
      this._updateControlsUI();
    }

    renderPinsOnly() {
      if (!this.pinsLayer) return;
      this.pinsLayer.innerHTML = "";

      this.stops.forEach((s, idx) => {
        const pct = ((s.pos / 255) * 100).toFixed(2);
        const hex = this._rgbToHex(s.r, s.g, s.b);
        const isActive = (idx === this.activeStopIndex);
        const isDragging = (this._isDragging && idx === this._dragIndex);

        const pin = document.createElement("div");
        pin.className = `gradient-pin ${isActive ? "active" : ""} ${isDragging ? "dragging" : ""}`;
        pin.dataset.index = String(idx);
        pin.style.left = `${pct}%`;
        pin.innerHTML = `
          <div class="pin-marker" style="background-color: ${hex};"></div>
          <div class="pin-tooltip">${Math.round((s.pos / 255) * 100)}%</div>
        `;
        this.pinsLayer.appendChild(pin);
      });
    }

    _updateControlsUI() {
      if (this.activeStopIndex < 0 || this.activeStopIndex >= this.stops.length) {
        if (this.colorPicker) this.colorPicker.disabled = true;
        if (this.hexInput) {
          this.hexInput.disabled = true;
          this.hexInput.value = "---";
        }
        if (this.posSlider) this.posSlider.disabled = true;
        if (this.posLabel) this.posLabel.textContent = "--";
        if (this.delBtn) this.delBtn.disabled = true;
        if (this.addBtn) this.addBtn.disabled = (this.stops.length >= this.options.maxStops);
        return;
      }

      const activeStop = this.stops[this.activeStopIndex];
      const hex = this._rgbToHex(activeStop.r, activeStop.g, activeStop.b);
      const pct = Math.round((activeStop.pos / 255) * 100);

      if (this.colorPicker) {
        this.colorPicker.disabled = false;
        this.colorPicker.value = hex;
      }
      if (this.hexInput) {
        this.hexInput.disabled = false;
        this.hexInput.value = hex.toUpperCase();
      }
      if (this.posSlider) {
        this.posSlider.disabled = false;
        this.posSlider.value = String(pct);
      }
      if (this.posLabel) this.posLabel.textContent = `${pct}%`;

      if (this.delBtn) this.delBtn.disabled = (this.stops.length <= this.options.minStops);
      if (this.addBtn) this.addBtn.disabled = (this.stops.length >= this.options.maxStops);
    }

    toCssLinearGradient(direction = "to right") {
      if (!this.stops || this.stops.length === 0) return "#00ffff";
      const sorted = [...this.stops].sort((a, b) => a.pos - b.pos);
      const parts = sorted.map((s) => {
        const pct = ((s.pos / 255) * 100).toFixed(1);
        return `rgb(${s.r}, ${s.g}, ${s.b}) ${pct}%`;
      });
      const s0 = sorted[0];
      const sLast = sorted[sorted.length - 1];
      if (sLast.pos < 255) {
        // Render seamless cyclic wrap back to first stop color at 100%
        parts.push(`rgb(${s0.r}, ${s0.g}, ${s0.b}) 100%`);
      }
      return `linear-gradient(${direction}, ${parts.join(", ")})`;
    }

    sampleAt(pos255) {
      if (!this.stops || this.stops.length === 0) return [0, 255, 255];
      const sorted = [...this.stops].sort((a, b) => a.pos - b.pos);
      const norm = ((pos255 % 256) + 256) % 256;
      const s0 = sorted[0];
      const sLast = sorted[sorted.length - 1];

      if (norm <= s0.pos) {
        const wrapSpan = (255 - sLast.pos) + s0.pos;
        if (wrapSpan === 0) return [s0.r, s0.g, s0.b];
        const progress = (norm + (255 - sLast.pos)) / wrapSpan;
        return [
          Math.round(sLast.r + (s0.r - sLast.r) * progress),
          Math.round(sLast.g + (s0.g - sLast.g) * progress),
          Math.round(sLast.b + (s0.b - sLast.b) * progress)
        ];
      }
      if (norm >= sLast.pos) {
        const wrapSpan = (255 - sLast.pos) + s0.pos;
        if (wrapSpan === 0) return [sLast.r, sLast.g, sLast.b];
        const progress = (norm - sLast.pos) / wrapSpan;
        return [
          Math.round(sLast.r + (s0.r - sLast.r) * progress),
          Math.round(sLast.g + (s0.g - sLast.g) * progress),
          Math.round(sLast.b + (s0.b - sLast.b) * progress)
        ];
      }

      for (let i = 0; i < sorted.length - 1; i++) {
        const cur = sorted[i];
        const next = sorted[i + 1];
        if (norm >= cur.pos && norm <= next.pos) {
          const span = next.pos - cur.pos;
          if (span === 0) return [cur.r, cur.g, cur.b];
          const t = (norm - cur.pos) / span;
          return [
            Math.round(cur.r + (next.r - cur.r) * t),
            Math.round(cur.g + (next.g - cur.g) * t),
            Math.round(cur.b + (next.b - cur.b) * t)
          ];
        }
      }
      return [s0.r, s0.g, s0.b];
    }

    getStops() {
      return [...this.stops].sort((a, b) => a.pos - b.pos);
    }

    setStops(stops, emitChange = false) {
      if (!Array.isArray(stops) || stops.length < 2) return;
      this.stops = JSON.parse(JSON.stringify(stops)).sort((a, b) => a.pos - b.pos);
      this.activeStopIndex = 0;
      this.render();
      if (emitChange) {
        this._emitChange();
      }
    }

    _emitChange() {
      if (typeof this.options.onChange === "function") {
        this.options.onChange(this.getStops());
      }
    }

    _rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => {
        const hex = Math.max(0, Math.min(255, Math.round(x))).toString(16);
        return hex.length === 1 ? "0" + hex : hex;
      }).join("");
    }

    _hexToRgb(hex) {
      const c = hex.replace("#", "");
      return [
        parseInt(c.substring(0, 2), 16) || 0,
        parseInt(c.substring(2, 4), 16) || 0,
        parseInt(c.substring(4, 6), 16) || 0
      ];
    }
  }

  window.GradientEditor = GradientEditor;
  window.PRESET_GRADIENTS = PRESET_GRADIENTS;
})();

/**
 * GMMK Studio - Visual Keymap & Rotary Encoder Editor Engine
 */

(function () {
  class KeymapEditor {
    constructor(protocol) {
      this.protocol = protocol;
      this.activeLayer = 0;
      this.selectedKey = null; // { type: 'matrix'|'encoder', id, row, col, direction }
      this.selectedCategory = 'basic';
      this.layerData = {
        0: new Map(),
        1: new Map(),
        2: new Map()
      };
      this.encoderData = {
        0: { CCW: 0x00AA, CW: 0x00A9, Press: 0x00A8 },
        1: { CCW: 0x00AA, CW: 0x00A9, Press: 0x0001 },
        2: { CCW: 0x0001, CW: 0x0001, Press: 0x0001 }
      };
      this.isLoaded = false;
      this.onKeycodeChange = null;
    }

    getActiveLayout() {
      const profile = window.deviceManager ? window.deviceManager.getActiveProfile() : null;
      if (window.LayoutEngine && typeof window.LayoutEngine.getLayoutForProfile === 'function') {
        return window.LayoutEngine.getLayoutForProfile(profile);
      }
      return window.GMMK3_LAYOUT || [];
    }

    init() {
      // Pre-populate layer 0 with default keycodes and layer 1 with QMK default FL keycodes
      const defaultFLMap = {
        F1: 0x00A5, F2: 0x00A6, F3: 0x00A7, F4: 0x00A8, F5: 0x00A9, F6: 0x00AA,
        F7: 0x00AB, F8: 0x00AC, F9: 0x00AD, F10: 0x00AE, F11: 0x00AF, F12: 0x0046,
        O: 0x7E40, Z: 0x7C04, X: 0x7C05, C: 0x7C06, V: 0x7C07, LWIN: 0x7B00,
        UP: 0x7C03, DOWN: 0x7C02, LEFT: 0x7C00, RGHT: 0x7C01
      };

      const layout = this.getActiveLayout();
      if (layout) {
        layout.forEach(k => {
          const [r, c] = k.matrix;
          if (r >= 0 && c >= 0) {
            this.layerData[0].set(`${r},${c}`, k.defaultKeycode || 0x0000);
            this.layerData[1].set(`${r},${c}`, defaultFLMap[k.id] || 0x0001 /* KC_TRNS */);
            this.layerData[2].set(`${r},${c}`, 0x0001 /* KC_TRNS */);
          }
        });
      }

      this._bindCategoryButtons();
      this._bindLayerButtons();
      this.renderKeycodePicker();
      this.renderKeyboard();
      this.renderEncoderPanel();
    }

    async loadKeymapFromDevice() {
      if (!this.protocol || !this.protocol.device) return;

      try {
        const rows = 14;
        const cols = 8;
        const layers = 3;
        
        // Load keymap buffer safely via chunked transfer
        const buffer = await this.protocol.readFullKeymap(layers, rows, cols);
        
        for (let l = 0; l < layers; l++) {
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const byteIdx = (l * rows * cols * 2) + (r * cols * 2) + (c * 2);
              const kc = (buffer[byteIdx] << 8) | buffer[byteIdx + 1];
              this.layerData[l].set(`${r},${c}`, kc);
            }
          }
        }

        // Load encoder mappings
        for (let l = 0; l < layers; l++) {
          try {
            const ccw = await this.protocol.getEncoder(l, 0, false);
            const cw = await this.protocol.getEncoder(l, 0, true);
            const press = this.layerData[l].get("11,6") || 0x00A8;
            this.encoderData[l] = { CCW: ccw, CW: cw, Press: press };
          } catch (e) {
            console.warn(`Could not load encoder layer ${l}`, e);
          }
        }

        this.isLoaded = true;
        this.renderKeyboard();
        this.renderEncoderPanel();
      } catch (e) {
        console.error("Error loading keymap from device:", e);
      }
    }

    setLayer(layerIndex) {
      this.activeLayer = parseInt(layerIndex, 10);
      document.querySelectorAll(".layer-btn").forEach(btn => {
        btn.classList.toggle("active", parseInt(btn.dataset.layer, 10) === this.activeLayer);
      });
      this.renderKeyboard();
      this.renderEncoderPanel();
    }

    selectKey(keyDesc) {
      this.selectedKey = keyDesc;
      document.querySelectorAll(".keycap-btn, .knob-slot-btn").forEach(el => {
        el.classList.remove("selected");
      });

      if (keyDesc) {
        const el = document.getElementById(`key-${keyDesc.id}`);
        if (el) el.classList.add("selected");
        this._updateSelectedKeyInfo();
      }
    }

    async assignKeycode(keycode) {
      if (!this.selectedKey) return;

      const layer = this.activeLayer;

      if (this.selectedKey.type === "encoder") {
        const dir = this.selectedKey.direction;
        if (dir === "Press") {
          this.layerData[layer].set("11,6", keycode);
          if (this.protocol && this.protocol.device) {
            await this.protocol.setKeycode(layer, 11, 6, keycode);
          }
          this.encoderData[layer].Press = keycode;
        } else {
          const isClockwise = dir === "CW";
          this.encoderData[layer][dir] = keycode;
          if (this.protocol && this.protocol.device) {
            await this.protocol.setEncoder(layer, 0, isClockwise, keycode);
          }
        }
        this.renderEncoderPanel();
        this.renderKeyboard();
      } else {
        const [r, c] = this.selectedKey.matrix;
        this.layerData[layer].set(`${r},${c}`, keycode);

        if (this.protocol && this.protocol.device) {
          await this.protocol.setKeycode(layer, r, c, keycode);
        }
        this.renderKeyboard();
      }

      this._updateSelectedKeyInfo();
      if (this.onKeycodeChange) {
        this.onKeycodeChange(this.selectedKey, keycode);
      }
    }

    _promptAnyKeycode() {
      if (!this.selectedKey) {
        const msg = window.i18n ? window.i18n.t("selectedKeyDefault") || "Click any keycap on the keyboard to select it first" : "Click any keycap on the keyboard to select it first";
        alert(msg);
        return;
      }

      const input = prompt(
        "Enter custom keycode in Hex (e.g. 0x5DB0 or 5DB0) or Decimal (0 - 65535):",
        "0x"
      );
      if (!input || !input.trim()) return;

      const trimmed = input.trim();
      let code = null;
      if (trimmed.toLowerCase().startsWith("0x")) {
        code = parseInt(trimmed, 16);
      } else if (!isNaN(Number(trimmed))) {
        code = parseInt(trimmed, 10);
      } else {
        const hexVal = parseInt(trimmed, 16);
        if (!isNaN(hexVal)) code = hexVal;
      }

      if (code !== null && !isNaN(code) && code >= 0 && code <= 0xFFFF) {
        this.assignKeycode(code);
      } else {
        alert("Invalid keycode! Please enter a valid 16-bit keycode (0x0000 - 0xFFFF).");
      }
    }

    renderKeyboard() {
      const container = document.getElementById("keyboardCanvas");
      if (!container) return;

      container.innerHTML = "";

      const profile = window.deviceManager ? window.deviceManager.getActiveProfile() : null;
      const layout = this.getActiveLayout();
      const bounds = window.LayoutEngine ? window.LayoutEngine.getLayoutBounds(layout) : { width: 22.5, height: 6.25 };

      // Dynamically size the canvas container for auto-scaling
      container.style.setProperty("--keyboard-width-units", bounds.width);
      container.style.setProperty("--keyboard-height-units", bounds.height);
      container.style.width = `calc(${bounds.width} * var(--key-unit) + 36px)`;
      container.style.height = `calc(${bounds.height} * var(--key-unit) + 36px)`;

      // Toggle side diffusers visibility on chassis based on device profile capabilities
      const hasSidelights = !!(profile && profile.capabilities && profile.capabilities.hasSidelights);
      container.classList.toggle("has-sidelights", hasSidelights);

      layout.forEach(key => {
        const keyEl = document.createElement("div");
        keyEl.className = `keycap-btn key-group-${key.group}`;
        keyEl.id = `key-${key.id}`;
        
        // CSS position and dimensions with chassis bezel padding
        keyEl.style.left = `calc(${key.x} * var(--key-unit) + 18px)`;
        keyEl.style.top = `calc(${key.y} * var(--key-unit) + 18px)`;
        keyEl.style.width = `calc(${key.w} * var(--key-unit) - 4px)`;
        keyEl.style.height = `calc(${key.h} * var(--key-unit) - 4px)`;

        // Keycode lookup with robust default fallback
        const [r, c] = key.matrix;
        let currentCode = this.layerData[this.activeLayer]?.get(`${r},${c}`);
        if (currentCode === undefined || currentCode === null) {
          currentCode = (this.activeLayer === 0) ? (key.defaultKeycode || 0x0000) : 0x0001;
        }
        const kcMeta = window.getKeycodeInfo ? window.getKeycodeInfo(currentCode) : { label: key.label, name: "" };
        const isTrns = this.activeLayer > 0 && (currentCode === 0x0001 || currentCode === 1);
        const shortLabel = isTrns ? "▽" : (window.getShortKeycodeLabel ? window.getShortKeycodeLabel(kcMeta) : (kcMeta.label || key.label));
        const defaultKc = key.defaultKeycode;
        const isCustom = this.activeLayer > 0 ? !isTrns : (defaultKc !== undefined && currentCode !== defaultKc && currentCode !== 0x0000);
        const isSingleLegend = !isCustom && !isTrns;
        const fontClass = window.getFontSizeClass ? window.getFontSizeClass(shortLabel) : "font-md";

        const isSelected = this.selectedKey && this.selectedKey.id === key.id;
        if (isSelected) keyEl.classList.add("selected");
        if (isTrns) keyEl.classList.add("is-trns");
        if (isCustom) keyEl.classList.add("is-custom-mapped");
        if (!isSingleLegend) keyEl.classList.add("has-dual-legend");

        keyEl.title = `${key.label || key.id}: ${kcMeta.name || ''} ${kcMeta.label ? `— ${kcMeta.label}` : ''} (0x${currentCode.toString(16).padStart(4, '0').toUpperCase()})`;

        if (key.isLogo) {
          keyEl.classList.add("keycap-logo-badge");
          keyEl.innerHTML = "";
          keyEl.style.cursor = "default";
        } else if (key.isKnob) {
          keyEl.classList.add("keycap-knob");
          keyEl.innerHTML = `<div class="knob-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="3" x2="12" y2="7"></line></svg></div>`;
        } else {
          if (isSingleLegend) {
            keyEl.innerHTML = `<div class="key-primary single-legend ${fontClass}">${shortLabel}</div>`;
          } else if (isTrns) {
            keyEl.innerHTML = `
              <div class="key-secondary">${key.label}</div>
              <div class="key-primary is-trns">▽</div>
            `;
          } else {
            keyEl.innerHTML = `
              <div class="key-secondary mod-origin">${key.label}</div>
              <div class="key-primary is-custom ${fontClass}">${shortLabel}</div>
            `;
          }
        }

        keyEl.addEventListener("click", () => {
          if (key.isLogo) return;
          if (key.isKnob) {
            if (window.gUI) {
              window.gUI.switchView("encoder");
            }
            this.selectKey({
              type: "encoder",
              id: "ENCODER_PRESS",
              matrix: (key.matrix && key.matrix[0] >= 0) ? key.matrix : [11, 6],
              direction: "Press",
              defaultLabel: "Knob Press"
            });
            return;
          }
          this.selectKey({
            type: "matrix",
            id: key.id,
            matrix: key.matrix,
            direction: null,
            defaultLabel: key.label
          });
        });

        container.appendChild(keyEl);
      });

      window.gUI?.fitKeyboardPreviews();
    }

    renderEncoderPanel() {
      const panel = document.getElementById("encoderConfigWidget");
      if (!panel) return;

      const enc = this.encoderData[this.activeLayer] || { CCW: 0x00AA, CW: 0x00A9, Press: 0x00A8 };
      const ccwInfo = window.getKeycodeInfo(enc.CCW);
      const cwInfo = window.getKeycodeInfo(enc.CW);
      const pressInfo = window.getKeycodeInfo(enc.Press);

      const ccwLabel = window.i18n ? window.i18n.t("rotCCW") : "Rotate Left (CCW)";
      const pressLabel = window.i18n ? window.i18n.t("knobPress") : "Knob Press (Click)";
      const cwLabel = window.i18n ? window.i18n.t("rotCW") : "Rotate Right (CW)";

      panel.innerHTML = `
        <div class="encoder-slots-grid">
          <div class="knob-slot-btn ${this.selectedKey?.direction === 'CCW' ? 'selected' : ''}" id="key-ENCODER_CCW" data-dir="CCW">
            <span class="slot-dir">${ccwLabel}</span>
            <span class="slot-code">${ccwInfo.label}</span>
          </div>
          <div class="knob-slot-btn ${this.selectedKey?.direction === 'Press' ? 'selected' : ''}" id="key-ENCODER_PRESS" data-dir="Press">
            <span class="slot-dir">${pressLabel}</span>
            <span class="slot-code">${pressInfo.label}</span>
          </div>
          <div class="knob-slot-btn ${this.selectedKey?.direction === 'CW' ? 'selected' : ''}" id="key-ENCODER_CW" data-dir="CW">
            <span class="slot-dir">${cwLabel}</span>
            <span class="slot-code">${cwInfo.label}</span>
          </div>
        </div>
      `;

      panel.querySelectorAll(".knob-slot-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const dir = btn.dataset.dir;
          this.selectKey({
            type: "encoder",
            id: `ENCODER_${dir === 'Press' ? 'PRESS' : dir}`,
            matrix: [11, 6],
            direction: dir,
            defaultLabel: `Knob ${dir}`
          });
        });
      });
    }

    renderKeycodePicker() {
      const pickers = document.querySelectorAll("#keycodePickerPalette, #encoderKeycodePickerPalette");
      if (!pickers || pickers.length === 0) return;

      const lightingType = window.deviceManager ? window.deviceManager.getLightingType() : 'rgb_matrix';
      let filtered = window.KEYCODES_DB.filter(k => k.category === this.selectedCategory);

      if (this.selectedCategory === 'lighting') {
        if (lightingType === 'monochrome') {
          filtered = filtered.filter(k => !k.lightingType || k.lightingType === 'monochrome');
        } else if (lightingType === 'rgb_matrix') {
          filtered = filtered.filter(k => !k.lightingType || k.lightingType === 'rgb_matrix' || k.lightingType === 'monochrome');
        } else if (lightingType === 'none') {
          filtered = [];
        }
      }

      pickers.forEach(picker => {
        picker.innerHTML = "";
        filtered.forEach(kc => {
          const btn = document.createElement("button");
          btn.className = "palette-key-btn";
          if (kc.isAny) btn.classList.add("pal-any-btn");
          btn.title = `${kc.name} (${kc.title || kc.label})`;
          btn.innerHTML = `
            <span class="pal-label">${kc.label}</span>
            <span class="pal-name">${kc.name}</span>
          `;

          btn.addEventListener("click", () => {
            if (kc.isAny) {
              this._promptAnyKeycode();
              return;
            }
            this.assignKeycode(kc.code);
          });

          picker.appendChild(btn);
        });
      });
    }

    _bindCategoryButtons() {
      document.querySelectorAll(".cat-tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const cat = btn.dataset.category;
          this.selectedCategory = cat;
          document.querySelectorAll(".cat-tab-btn").forEach(b => {
            b.classList.toggle("active", b.dataset.category === cat);
          });
          this.renderKeycodePicker();
        });
      });
    }

    _bindLayerButtons() {
      document.querySelectorAll(".layer-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          this.setLayer(btn.dataset.layer);
        });
      });
      if (window.i18n && typeof window.i18n.onChange === "function") {
        window.i18n.onChange(() => {
          this.renderEncoderPanel();
          this._updateSelectedKeyInfo();
        });
      }
    }

    _updateSelectedKeyInfo() {
      const banner = document.getElementById("selectedKeyBanner");
      if (!banner) return;

      if (!this.selectedKey) {
        const defText = window.i18n ? window.i18n.t("selectedKeyDefault") : "Click any keycap on the keyboard to remap it";
        banner.innerHTML = `<span class="muted-text">${defText}</span>`;
        return;
      }

      let currentCode = 0;
      if (this.selectedKey.type === "encoder") {
        currentCode = this.encoderData[this.activeLayer][this.selectedKey.direction];
      } else {
        const [r, c] = this.selectedKey.matrix;
        currentCode = this.layerData[this.activeLayer]?.get(`${r},${c}`) || 0;
      }

      const meta = window.getKeycodeInfo(currentCode);
      const lyrLabel = window.i18n ? window.i18n.t("layerLabel") : "Layer";
      const asgnLabel = window.i18n ? window.i18n.t("assignedLabel") : "Assigned:";

      banner.innerHTML = `
        <div class="selected-badge">
          <span class="badge-target">${lyrLabel} ${this.activeLayer} › ${this.selectedKey.defaultLabel || this.selectedKey.id}</span>
          <span class="badge-code">${asgnLabel} <strong>${meta.label}</strong> [${meta.name}]</span>
        </div>
      `;
    }
  }

  window.KeymapEditor = KeymapEditor;
})();

  class LightingController {
    constructor(protocol) {
      this.protocol = protocol;
      this.activeTab = "backlight";
      this.isVisualizerRunning = false;
      this.animFrameId = null;
      this.visualizerKeys = [];
      this.sideDiffusers = [];
      this.logoBadgeEl = null;

      // Real reactive tracking
      this.hits = []; // [{ id, x, y, time, hue }]
      this.lastHitPerKey = new Map(); // keyId -> { id, x, y, time, hue }
      this.keyHeat = new Map(); // keyId -> float (0..255)
      this.lastHeatTick = performance.now();

      // Raindrops state cache
      this.raindropsCache = new Map();

      this.activeVisualizerLayer = 0; // 0 = Base, 1 = Fn, 2 = Custom
      this.isFnSimHeld = false;
      this.pollTimer = null;

      this.state = {

          layerDimLevel: 128,

          layer2Color: [128, 255],  // Turquoise
          layer3Color: [200, 255],  // Magenta

          lockColors: {

            num: [165, 255],        // #001EFF (Blue)
            scroll: [77, 255],      // #32FF00 (Lime Green)
            capsNum: [8, 255],      // #FF3200 (Orange)
            capsScroll: [43, 255],  // #FFFF00 (Yellow)

            all: [0, 0]             // #FFFFFF (White)
          },
          winLockMode: 0,           // 0: Animation, 1: Off, 2: Custom Color
          winLockColor: [0, 255],   // Default Red
          winLockActive: false,     // Live Win Lock state
          reactiveEnable: false,
          reactiveMode: 1,          // Default 1: Reactive Fade
          reactiveColor: [0, 255],  // Default Red/Accent
          reactiveSpeed: 128,
          reactiveBlend: 0,         // 0: Additive Glow, 1: Solid Override
          effectDensity: 128,       // 128 = 1.0x baseline spatial density
          activeGradient: 0,
          customProfiles: [
            // Profile 1 (0): Default Cyan -> Hot Pink -> Yellow (33.3% equal intervals)
            [
              { pos: 0, r: 0, g: 255, b: 255 },
              { pos: 85, r: 255, g: 0, b: 128 },
              { pos: 170, r: 255, g: 255, b: 0 }
            ],
            // Profile 2 (1): Default Deep Purple -> Sunset Orange -> Golden Sun (33.3% equal intervals)
            [
              { pos: 0, r: 128, g: 0, b: 255 },
              { pos: 85, r: 255, g: 60, b: 0 },
              { pos: 170, r: 255, g: 215, b: 0 }
            ]
          ],
          perKeyProfiles: [
            this._generateDefaultPerKeyProfile(0), // FPS Gaming
            this._generateDefaultPerKeyProfile(1), // MOBA Gaming
            this._generateDefaultPerKeyProfile(2)  // MMO / RPG
          ],
          sidelightCustomEnable: false,
          sidelightMode: 1,
          sidelightColor: [0, 255],

        },

          enabled: true,

      this.activePerKeyProfile = 0; // 0: FPS, 1: MOBA, 2: MMO
      this.perKeyPaintColor = "#ff1e27";
      this.perKeySelection = new Set();
      this._pendingPerKeyBlocks = new Map();
      this._perKeyStreamTimer = null;
      this._isStreamingPerKey = false;

      this._gradientLut = null;
      this._pendingStopsProf = 0;
      this._pendingStops = null;
      this._stopsThrottleTimer = null;
