/* === css/variables.css === */
:root {
  /* Colorystyka bazowa i tła */
  --bg-dark: #080b11;
  --bg-darker: #040608;
  --bg-sidebar: #0b0f19;
  --bg-card: rgba(18, 24, 38, 0.75);
  --bg-card-hover: rgba(26, 35, 55, 0.9);
  --bg-glass: rgba(255, 255, 255, 0.03);
  --bg-glass-active: rgba(255, 255, 255, 0.08);

  /* Obramowania i efekty poświaty */
  --border-color: rgba(255, 255, 255, 0.08);
  --border-color-hover: rgba(255, 255, 255, 0.2);
  --border-glow: rgba(99, 102, 241, 0.4);

  /* Akcenty kolorystyczne */
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-glow: rgba(99, 102, 241, 0.45);
  --secondary: #8b5cf6;
  --secondary-glow: rgba(139, 92, 246, 0.45);
  --accent-cyan: #00f0ff;
  --accent-cyan-glow: rgba(0, 240, 255, 0.4);
  --accent-green: #10b981;
  --accent-amber: #f59e0b;
  --accent-red: #ef4444;

  /* Keycap Styling Tokens */
  --key-unit: 46px;
  --key-bg: #141b2d;
  --key-bg-hover: #1e2942;
  --key-bg-active: #00f0ff;
  --key-border: #232f48;
  --key-text: #e2e8f0;
  --key-subtext: #64748b;

  /* Typografia i barwy tekstu */
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'Cascadia Code', 'Consolas', 'Segoe UI Mono', 'Courier New', monospace;

  /* Promienie zaokrągleń */
  --radius-xl: 16px;
  --radius-lg: 12px;
  --radius-md: 8px;
  --radius-sm: 6px;

  /* Cienie */
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 25px var(--primary-glow);
  --shadow-cyan-glow: 0 0 20px var(--accent-cyan-glow);

  /* Płynne animacje */
  --transition-fast: all 0.15s ease;
  --transition-normal: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-slow: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

/* === css/sidebar.css === */
/* GMMK 3 Companion - Sidebar Navigation Styling */

.app-wrapper {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

.sidebar {
  width: 260px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 50;
  backdrop-filter: blur(12px);
}

.sidebar-brand {
  padding: 1.25rem 1.15rem;
  display: flex;
  align-items: center;
  gap: 0.95rem;
  border-bottom: 1px solid var(--border-color);
}

.sidebar-logo-badge {
  background: transparent;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 0 12px rgba(0, 245, 255, 0.40)) drop-shadow(0 0 4px rgba(99, 102, 241, 0.35));
  padding: 0;
  overflow: visible;
  flex-shrink: 0;
  transition: transform 0.2s ease, filter 0.2s ease;
}

.sidebar-logo-badge:hover {
  transform: scale(1.05);
  filter: drop-shadow(0 0 16px rgba(0, 245, 255, 0.65)) drop-shadow(0 0 8px rgba(99, 102, 241, 0.5));
}

.sidebar-logo-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.sidebar-brand-text h2 {
  font-size: 1.12rem;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.sidebar-brand-text span {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
  line-height: 1.3;
}

.sidebar-nav {
  padding: 1.25rem 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  flex: 1;
}

.nav-item-btn {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.75rem 1rem;
  border-radius: var(--radius-md);
  color: var(--text-muted);
  background: transparent;
  border: 1px solid transparent;
  font-size: 0.9rem;
  font-weight: 500;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: background-color 0.1s ease, border-color 0.1s ease, color 0.1s ease, box-shadow 0.1s ease;
  text-align: left;
  width: 100%;
}

.nav-item-btn:hover {
  background: var(--bg-card);
  color: var(--text-main);
  border-color: var(--border-color);
}

.nav-item-btn.active {
  background: linear-gradient(90deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.05));
  color: #ffffff;
  font-weight: 600;
  border-color: rgba(99, 102, 241, 0.3);
  box-shadow: inset 3px 0 0 var(--primary);
}

.nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  color: inherit;
  flex-shrink: 0;
}

.nav-icon svg {
  width: 18px;
  height: 18px;
  stroke: var(--text-muted);
  display: block;
  transition: stroke 0.08s ease, filter 0.08s ease;
}

.nav-item-btn:hover .nav-icon svg {
  stroke: #ffffff;
}

.nav-item-btn.active .nav-icon svg {
  stroke: var(--accent-cyan, #00f0ff);
  filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.45));
}

.sidebar-footer {
  padding: 0.85rem 0.85rem 1rem 0.85rem;
  border-top: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.sidebar-footer-grid {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.55rem;
  width: 100%;
}

.sidebar-icon-btn {
  flex: 1;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-muted);
  cursor: pointer;
  transition: var(--transition-normal);
  padding: 0;
}

.sidebar-icon-btn:hover {
  background: var(--bg-card);
  color: var(--accent-cyan);
  border-color: rgba(0, 240, 255, 0.4);
  box-shadow: 0 0 12px rgba(0, 240, 255, 0.18);
  transform: translateY(-2px);
}

.sidebar-icon-btn:active {
  transform: translateY(0);
}

.sidebar-icon-btn .footer-btn-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  color: inherit;
}

.sidebar-icon-btn .footer-btn-icon svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  display: block;
}

.device-chip {
  display: none;
}


/* === css/layout.css === */
/* GMMK 3 Companion - Main App Layout & Multi-View Containers */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.03) 0%, transparent 60%);
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow-y: auto;
  background: transparent;
}

/* Top App Bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  min-width: 0;
  padding: 0.75rem 1.5rem;
  background: rgba(8, 11, 17, 0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 40;
}

.top-bar-left {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex: 0 0 auto;
  max-width: 340px;
  min-width: 0;
  overflow: hidden;
}

.view-title-wrap {
  min-width: 0;
  overflow: hidden;
}

.view-title-wrap h1 {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.25;
}

.view-title-wrap p {
  font-size: 0.75rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 320px;
  line-height: 1.25;
  margin-top: 2px;
}

.top-bar-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex: 0 0 auto;
  margin-left: auto;
}

@media (max-width: 1250px) {
  .view-title-wrap p {
    display: none;
  }
}

@media (max-width: 1100px) {
  .topbar-unsaved-text {
    display: none !important;
  }
}

@media (max-width: 950px) {
  .top-bar {
    padding: 0.5rem 0.75rem;
    gap: 0.5rem;
  }
  .top-bar-left {
    max-width: 180px;
  }
  .view-title-wrap h1 {
    font-size: 1rem;
  }
  .device-badge {
    display: none !important;
  }
}

/* View Section Switching */
.view-container {
  display: none;
  padding: 1rem 1.5rem;
  animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.view-container.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Grids & Cards */
.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 1.25rem;
  margin-top: 0.75rem;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.25rem;
  margin-top: 0.75rem;
}

/* Keymap Canvas Container */
.keyboard-canvas-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 1rem 1.25rem;
  box-shadow: var(--shadow-md);
  margin-bottom: 1rem;
  backdrop-filter: blur(16px);
}

.keyboard-canvas-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.75rem;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.layer-selector {
  display: flex;
  background: var(--bg-darker);
  padding: 0.2rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  gap: 0.2rem;
}

.layer-btn {
  padding: 0.35rem 0.85rem;
  border-radius: var(--radius-sm);
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 0.8rem;
  font-weight: 600;
  font-family: var(--font-mono);
  cursor: pointer;
  transition: var(--transition-fast);
}

.layer-btn:hover {
  color: var(--text-main);
  background: var(--bg-glass);
}

.layer-btn.active {
  background: var(--primary);
  color: #ffffff;
  box-shadow: 0 0 12px var(--primary-glow);
}

.keyboard-scroll-wrapper {
  overflow: visible;
  padding: 4px 0 18px 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  width: 100%;
  position: relative;
  box-sizing: content-box;
}

.keyboard-canvas {
  position: relative;
  width: calc(var(--keyboard-width-units, 22.5) * var(--key-unit) + 36px);
  height: calc(var(--keyboard-height-units, 6.25) * var(--key-unit) + 36px);
  background: linear-gradient(180deg, #141b2b 0%, #0c101a 60%, #06080e 100%);
  border-radius: 18px;
  border: 2px solid rgba(255, 255, 255, 0.12);
  padding: 18px;
  box-shadow: 
    0 12px 32px rgba(0, 0, 0, 0.75),
    0 0 0 1px rgba(0, 0, 0, 0.9),
    inset 0 1px 1px rgba(255, 255, 255, 0.15),
    inset 0 -3px 12px rgba(0, 0, 0, 0.8);
  flex-shrink: 0;
  user-select: none;
  transform-origin: top center;
  transition: transform 0.08s ease-out;
}

/* Subtle physical diffuser slot on Chassis - ONLY when device has sidelights */
.keyboard-canvas.has-sidelights::before,
.keyboard-canvas.has-sidelights::after {
  content: "";
  position: absolute;
  top: calc(0.85 * var(--key-unit) + 18px);
  height: calc((var(--keyboard-height-units, 6.25) - 1.7) * var(--key-unit));
  width: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.06);
  box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.9);
}

.keyboard-canvas.has-sidelights::before {
  left: 6px;
}

.keyboard-canvas.has-sidelights::after {
  right: 6px;
}

/* Keycode Picker Palette */
.palette-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 1rem 1.25rem;
  backdrop-filter: blur(16px);
}

.palette-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0.75rem;
  margin-bottom: 0.75rem;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.palette-category-tabs {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.cat-tab-btn {
  padding: 0.45rem 0.9rem;
  border-radius: var(--radius-md);
  background: var(--bg-glass);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition-fast);
}

.cat-tab-btn:hover {
  color: var(--text-main);
  background: var(--bg-card-hover);
}

.cat-tab-btn.active {
  background: rgba(0, 240, 255, 0.15);
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
  box-shadow: 0 0 10px var(--accent-cyan-glow);
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
  gap: 0.5rem;
  max-height: 280px;
  overflow-y: auto;
  padding-right: 0.5rem;
}

/* === css/components.css === */
/* GMMK 3 Companion - Interactive UI Components */

/* Keycap Button on Virtual Keyboard */
.keycap-btn {
  position: absolute;
  background: var(--key-bg, #111726);
  border: 1px solid var(--key-border, rgba(255, 255, 255, 0.1));
  border-radius: var(--radius-sm, 6px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 2px 3px;
  cursor: pointer;
  user-select: none;
  box-sizing: border-box;
  overflow: hidden;
  transition: transform 0.08s ease, border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.5);
}

.keycap-btn.has-dual-legend {
  justify-content: space-between;
  align-items: stretch;
  padding: 3px 4px;
}

.keycap-btn.is-custom-mapped {
  border-color: rgba(0, 240, 255, 0.35);
  background: #0f1c2e;
}

.keycap-btn.is-trns {
  opacity: 0.75;
  border-style: dashed;
  border-color: rgba(255, 255, 255, 0.12);
}

.keycap-btn:hover {
  background: var(--key-bg-hover, #1a233a);
  border-color: rgba(255, 255, 255, 0.35);
  transform: translateY(-1px);
  z-index: 5;
}

.keycap-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
}

.keycap-btn.selected {
  border-color: var(--accent-cyan, #00f0ff);
  box-shadow: 0 0 14px var(--accent-cyan-glow, rgba(0, 240, 255, 0.4)), inset 0 0 8px rgba(0, 240, 255, 0.2);
  background: #102436;
  z-index: 10;
}

.key-secondary {
  font-size: 0.58rem;
  color: var(--key-subtext, rgba(255, 255, 255, 0.45));
  font-family: var(--font-mono, monospace);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  line-height: 1;
  text-align: left;
  align-self: flex-start;
}

.key-secondary.mod-origin {
  opacity: 0.65;
  font-size: 0.55rem;
}

.key-primary {
  font-weight: 700;
  color: var(--key-text, #ffffff);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
  max-width: 100%;
  line-height: 1.15;
  transition: color 0.15s ease;
}

.key-primary.single-legend {
  margin: auto;
}

.key-primary.is-custom {
  color: var(--accent-cyan, #00f0ff);
  text-shadow: 0 0 8px rgba(0, 240, 255, 0.35);
}

.key-primary.is-trns {
  color: rgba(255, 255, 255, 0.3);
  font-size: 0.75rem;
  font-weight: 400;
}

.key-primary.font-lg {
  font-size: 0.85rem;
  letter-spacing: 0.01em;
}

.key-primary.font-md {
  font-size: 0.72rem;
  letter-spacing: 0;
}

.key-primary.font-sm {
  font-size: 0.60rem;
  letter-spacing: -0.01em;
}

.key-primary.font-xs {
  font-size: 0.50rem;
  letter-spacing: -0.02em;
}

/* Knob Specific Keycap */
.keycap-knob,
.keycap-btn.keycap-knob,
.lighting-keycap.keycap-knob {
  background: radial-gradient(circle at 35% 35%, #2a3b5c, #131b2e) !important;
  border-radius: 50% !important;
  border: 2px solid var(--secondary, #00f0ff) !important;
  box-shadow: 0 0 14px var(--secondary-glow, rgba(0, 240, 255, 0.4)), inset 0 0 6px rgba(0, 240, 255, 0.2) !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  text-align: center !important;
  padding: 0 !important;
  cursor: pointer;
  overflow: hidden;
  aspect-ratio: 1 / 1;
}

.keycap-knob:hover,
.lighting-keycap.keycap-knob:hover {
  transform: translateY(-1px) scale(1.05) !important;
  box-shadow: 0 0 18px var(--secondary-glow, rgba(0, 240, 255, 0.6)), inset 0 0 8px rgba(0, 240, 255, 0.3) !important;
}

.knob-icon {
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--secondary, #00f0ff);
}

/* Key Group Colors */
.key-group-mod { background: #162035; }
.key-group-func { background: #121829; }
.key-group-nav { background: #17223b; }
.key-group-numpad { background: #141c2e; }

/* Live RGB Visualizer Keycap */
.lighting-keycap {
  position: absolute;
  background: #111726;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  transition: transform 0.08s ease;
  contain: layout style;
  will-change: background-color;
}

.lighting-keycap:hover {
  transform: translateY(-1px) scale(1.02);
  z-index: 10;
}

.lighting-keycap:active {
  transform: translateY(2px) scale(0.97);
}

.lighting-keycap .l-legend {
  font-size: 0.72rem;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.95);
  text-shadow: 0 0 8px currentColor;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 90%;
  text-align: center;
}

.lighting-knob-preview {
  border-radius: 50% !important;
  background: radial-gradient(circle at 35% 35%, #2a3342, #10151d) !important;
  border: 2px solid rgba(255, 255, 255, 0.25) !important;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15) !important;
  color: #94a3b8 !important;
  cursor: pointer;
}

.lighting-knob-preview .l-legend {
  text-shadow: none !important;
  color: rgba(255, 255, 255, 0.7) !important;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lighting-knob-preview:hover {
  border-color: var(--accent-cyan, #00f0ff) !important;
  box-shadow: 0 0 12px rgba(0, 240, 255, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2) !important;
}

/* Glorious Logo LED Indicator Jewel on Chassis */
.lighting-logo-badge {
  border-radius: 9999px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  cursor: pointer;
  min-height: 0 !important;
  padding: 0 !important;
  box-sizing: border-box !important;
  transition: transform 0.08s ease !important;
  contain: layout style;
  will-change: background-color;
}

.keycap-logo-badge,
.lighting-keycap.logo-keycap {
  border-radius: 9999px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  min-height: 0 !important;
  padding: 0 !important;
  box-sizing: border-box !important;
}

.lighting-logo-badge .l-legend,
.lighting-keycap.logo-keycap .l-legend,
.keycap-logo-badge .key-primary,
.keycap-logo-badge .key-secondary {
  display: none !important;
}

/* Live Active Side LED Diffusers */
.side-diffusers-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 4;
}

.side-diffuser-segment {
  position: absolute;
  width: 5px;
  height: 18px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.15);
  pointer-events: auto;
  cursor: pointer;
  contain: layout style;
  transition: transform 0.1s ease, box-shadow 0.12s ease;
  will-change: background-color, box-shadow;
}

.side-diffuser-segment:hover {
  transform: scale(1.25);
  z-index: 10;
}

.side-diffuser-left {
  left: 6px;
}

.side-diffuser-right {
  right: 6px;
}

/* Live Status Pulse & Badge */
.live-dot-pulse {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 10px #10b981;
  animation: pulseLive 1.8s infinite ease-in-out;
}

@keyframes pulseLive {
  0% { transform: scale(0.9); opacity: 0.7; box-shadow: 0 0 4px #10b981; }
  50% { transform: scale(1.25); opacity: 1; box-shadow: 0 0 14px #10b981; }
  100% { transform: scale(0.9); opacity: 0.7; box-shadow: 0 0 4px #10b981; }
}

.badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.35rem 0.85rem;
  background: var(--bg-darker);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  font-size: 0.78rem;
  font-family: var(--font-mono);
  color: var(--accent-cyan);
  box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.1);
}

/* Palette Button */
.palette-key-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0.65rem 0.4rem;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-main);
  cursor: pointer;
  transition: var(--transition-fast);
  text-align: center;
  min-height: 52px;
}

.palette-key-btn:hover {
  background: rgba(0, 240, 255, 0.1);
  border-color: var(--accent-cyan);
  transform: translateY(-2px);
  box-shadow: 0 0 10px var(--accent-cyan-glow);
}

.pal-label {
  font-size: 0.85rem;
  font-weight: 700;
  line-height: 1.1;
}

.pal-name {
  font-size: 0.62rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-top: 2px;
}

/* Encoder Slots Grid */
.encoder-slots-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
}

.knob-slot-btn {
  display: flex;
  flex-direction: column;
  padding: 1rem;
  background: var(--bg-darker);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition-normal);
}

.knob-slot-btn:hover {
  border-color: var(--secondary);
  background: var(--bg-card);
}

.knob-slot-btn.selected {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 12px var(--accent-cyan-glow);
  background: rgba(0, 240, 255, 0.08);
}

.slot-dir {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 600;
}

.slot-code {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-main);
  margin-top: 0.35rem;
  font-family: var(--font-mono);
}

/* Tester Keycap */
.tester-keycap {
  position: absolute;
  background: #111827;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  transition: background-color 0.05s ease, border-color 0.05s ease;
}

.tester-keycap.tested {
  border-color: rgba(16, 185, 129, 0.5);
  background: #06281e;
  color: #34d399;
}

.tester-keycap.pressed {
  background: var(--accent-green) !important;
  color: #000000 !important;
  box-shadow: 0 0 15px rgba(16, 185, 129, 0.8);
  transform: scale(0.96);
}

/* History Chip */
.history-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.35rem 0.65rem;
  background: var(--bg-darker);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  margin: 0.25rem;
}

.chip-code { color: var(--accent-cyan); font-weight: 600; }
.chip-time { color: var(--text-dim); }

/* Buttons & Inputs */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.65rem 1.25rem;
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition-normal);
  border: 1px solid transparent;
  text-decoration: none;
}

.btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  flex-shrink: 0;
  display: block;
}

.btn-sm svg,
.btn-icon-sm svg {
  width: 13px;
  height: 13px;
}

.settings-card-icon svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  display: block;
}

.modal-section-title span:first-child svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  display: block;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #ffffff;
  box-shadow: 0 4px 14px var(--primary-glow);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--primary-glow);
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--text-main);
  border-color: var(--border-color);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--bg-card-hover);
  border-color: var(--border-color-hover);
}

.btn-danger {
  background: rgba(239, 68, 68, 0.12);
  border-color: rgba(239, 68, 68, 0.35);
  color: #f87171;
}

.btn-danger:hover:not(:disabled) {
  background: #ef4444;
  color: #ffffff;
  border-color: #ef4444;
  box-shadow: 0 0 16px rgba(239, 68, 68, 0.45);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  filter: grayscale(1);
}

/* Form Controls */
.form-group {
  margin-bottom: 1.25rem;
}

.form-group label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 0.5rem;
}

.form-control {
  width: 100%;
  padding: 0.65rem 0.85rem;
  background: var(--bg-darker);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  transition: var(--transition-fast);
}

.form-control:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 10px var(--primary-glow);
}

.range-slider-wrap {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.range-slider {
  flex: 1;
  accent-color: var(--primary);
}

.color-input-wrap {
  display: flex;
  align-items: center;
  gap: 0.85rem;
}

.color-picker-input {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  width: 48px;
  height: 38px;
  background: transparent;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
}

.color-picker-input::-webkit-color-swatch {
  border-radius: var(--radius-sm);
  border: 2px solid var(--border-color);
  box-shadow: 0 0 8px rgba(0, 0, 0, 0.4);
}

.color-item-card {
  background: var(--bg-darker);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 0.85rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.color-item-info {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.color-item-info strong {
  font-size: 0.85rem;
  color: var(--text-main);
}

.color-item-info span {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* Lighting Sub-Tabs Header */
.lighting-tabs-header {
  display: flex;
  gap: 0.5rem;
  background: var(--bg-darker);
  padding: 0.35rem;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  margin-bottom: 1.5rem;
  width: fit-content;
}

.lighting-tab-btn {
  padding: 0.6rem 1.25rem;
  border-radius: var(--radius-md);
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition-normal);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.lighting-tab-btn:hover {
  color: var(--text-main);
  background: var(--bg-glass);
}

.lighting-tab-btn.active {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #ffffff;
  box-shadow: 0 2px 10px var(--primary-glow);
}

.lighting-subview {
  display: none;
  animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.lighting-subview.active {
  display: block;
}

/* Switch Toggle */
.switch-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 0;
}

.switch {
  position: relative;
  display: inline-block;
  width: 46px;
  height: 24px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: var(--bg-darker);
  border: 1px solid var(--border-color);
  transition: .3s;
  border-radius: 24px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 16px;
  width: 16px;
  left: 3px;
  bottom: 3px;
  background-color: var(--text-muted);
  transition: .3s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: var(--primary);
  border-color: var(--primary);
}

input:checked + .slider:before {
  transform: translateX(22px);
  background-color: #ffffff;
}

/* Dropzone */
.dropzone {
  border: 2px dashed var(--border-color);
  border-radius: var(--radius-lg);
  padding: 2.5rem 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: var(--transition-normal);
  background: var(--bg-glass);
}

.dropzone:hover, .dropzone.dragover {
  border-color: var(--secondary);
  background: rgba(139, 92, 246, 0.08);
}

/* Floating Toast Notification */
.app-toast {
  position: fixed !important;
  bottom: 2rem;
  right: 2rem;
  background: rgba(18, 24, 38, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 0.85rem 1.35rem;
  border-radius: var(--radius-md);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  font-size: 0.9rem;
  font-weight: 500;
  z-index: 99999;
  opacity: 0;
  transform: translateY(20px);
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  gap: 0.6rem;
  max-width: 420px;
}

.app-toast.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
  cursor: pointer;
}

.app-toast.toast-info {
  border-color: rgba(6, 182, 212, 0.6);
  box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
}

.app-toast.toast-success {
  border-color: rgba(16, 185, 129, 0.5);
  box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
}

.app-toast.toast-warning {
  border-color: rgba(245, 158, 11, 0.5);
  box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
}

.app-toast.toast-error {
  border-color: rgba(239, 68, 68, 0.5);
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
}

/* Progress Bar Components */
.progress-container {
  background: rgba(13, 18, 31, 0.6);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 0.75rem 1rem;
}

.progress-track {
  width: 100%;
  height: 8px;
  background: rgba(0, 0, 0, 0.5);
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-cyan), var(--secondary));
  box-shadow: 0 0 10px var(--accent-cyan-glow);
  border-radius: 4px;
  transition: width 0.15s ease;
}

/* File Preview Card */
.file-preview-card {
  background: var(--bg-darker);
  border: 1px solid rgba(0, 240, 255, 0.25);
  border-radius: var(--radius-md);
  padding: 0.85rem 1rem;
}

.preview-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0.5rem;
  margin-bottom: 0.65rem;
}

.preview-stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.5rem;
}

.stat-pill, .stat-lbl-box {
  background: var(--bg-glass);
  padding: 0.35rem 0.65rem;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-mono);
}

.stat-lbl {
  color: var(--text-muted);
}

/* USB HID Protocol Event Console */
.console-card {
  background: #090d16;
  border: 1px solid rgba(99, 102, 241, 0.25);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.console-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 1.25rem;
  background: rgba(15, 23, 42, 0.9);
  border-bottom: 1px solid var(--border-color);
}

.console-log {
  padding: 1rem 1.25rem;
  max-height: 240px;
  overflow-y: auto;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.log-line {
  display: flex;
  gap: 0.75rem;
  word-break: break-all;
}

.log-time {
  color: var(--text-dim);
  flex-shrink: 0;
}

.log-info {
  color: var(--text-main);
}

.log-success {
  color: var(--accent-green);
}

.log-warning {
  color: var(--accent-amber);
}

.log-error {
  color: var(--accent-pink);
}

/* ==========================================================================
   Custom Device Selector & Dropdown Menu
   ========================================================================== */
.top-bar-center {
  flex: 1 1 auto;
  max-width: 440px;
  min-width: 220px;
  margin: 0 0.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.custom-device-selector {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 440px;
}

.device-selector-btn {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 38px;
  padding: 0 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-main);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
  text-align: left;
  user-select: none;
  overflow: hidden;
  min-width: 0;
}

.device-selector-btn:hover {
  border-color: var(--accent-cyan);
  background: rgba(14, 20, 34, 0.95);
  box-shadow: 0 0 12px var(--accent-cyan-glow);
}

.device-selector-btn.active,
.device-selector-btn[aria-expanded="true"] {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 16px var(--accent-cyan-glow);
  background: rgba(14, 20, 34, 1);
}

.device-status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #64748b;
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.device-status-dot.connected {
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
}

.device-icon {
  font-size: 0.95rem;
  line-height: 1;
  flex-shrink: 0;
}

.device-name-display {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-main);
  min-width: 0;
}

.device-badge {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(0, 240, 255, 0.15);
  color: var(--accent-cyan);
  border: 1px solid rgba(0, 240, 255, 0.3);
  flex-shrink: 0;
  letter-spacing: 0.02em;
  transition: all 0.2s ease;
}

.device-badge.disconnected {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  border-color: var(--border-color);
}

.device-chevron {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), color 0.2s ease;
  flex-shrink: 0;
  margin-left: 2px;
}

.device-selector-btn[aria-expanded="true"] .device-chevron {
  transform: rotate(180deg);
  color: var(--accent-cyan);
}

.btn-pair-device {
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--accent-cyan);
  cursor: pointer;
  transition: all var(--transition-fast);
  flex-shrink: 0;
  padding: 0;
}

.btn-pair-device:hover {
  border-color: var(--accent-cyan);
  background: rgba(0, 240, 255, 0.15);
  transform: translateY(-1px);
  box-shadow: 0 0 12px var(--accent-cyan-glow);
  color: #fff;
}

.btn-pair-device:active {
  transform: translateY(0);
}

.device-dropdown-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  width: calc(100% - 44px);
  min-width: 280px;
  background: rgba(10, 14, 23, 0.98);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.1);
  z-index: 100;
  padding: 6px;
  display: none;
  flex-direction: column;
  animation: fadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}

.device-dropdown-menu.show {
  display: flex;
}

.device-dropdown-header {
  padding: 6px 10px 4px;
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}

.device-dropdown-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 220px;
  overflow-y: auto;
}

.device-dropdown-empty {
  padding: 10px;
  font-size: 0.8rem;
  color: var(--text-muted);
  text-align: center;
}

.device-dropdown-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--text-main);
  font-size: 0.83rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
  text-align: left;
  width: 100%;
  outline: none;
}

.device-dropdown-item:hover {
  background: rgba(0, 240, 255, 0.12);
  color: #fff;
}

.device-dropdown-item.active {
  background: rgba(0, 240, 255, 0.18);
  color: var(--accent-cyan);
  font-weight: 600;
}

.device-dropdown-item .item-icon {
  font-size: 0.95rem;
  flex-shrink: 0;
}

.device-dropdown-item .item-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.device-dropdown-item .item-check {
  margin-left: auto;
  color: var(--accent-cyan);
  font-size: 0.85rem;
  font-weight: 700;
}

.device-dropdown-divider {
  height: 1px;
  background: var(--border-color);
  margin: 5px 0;
}

.add-device-item {
  color: var(--accent-cyan);
  font-weight: 600;
}

.add-device-item:hover {
  background: rgba(0, 240, 255, 0.18);
  color: #fff;
}

/* Also ensure native <select> options dark background across entire app */
select option {
  background: #0d121d;
  color: #f1f5f9;
}

.device-dropdown-item .item-icon-svg {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  color: var(--accent-cyan);
  flex-shrink: 0;
  transition: transform var(--transition-fast), color var(--transition-fast);
}

.device-dropdown-item:hover .item-icon-svg {
  transform: rotate(90deg);
  color: #fff;
}

/* ==========================================================================
   SETTINGS VIEW & ADVANCED DEVICE CONTROLS
   ========================================================================== */

.settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 1.5rem;
  align-items: start;
  max-width: 1600px;
  margin: 0 auto;
}

.settings-card {
  display: flex;
  flex-direction: column;
  padding: 1.5rem;
  gap: 1.25rem;
}

.settings-card-header {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border-color);
}

.settings-card-icon {
  font-size: 1.4rem;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.settings-card-subtitle {
  color: var(--text-muted);
  font-size: 0.8rem;
  margin-top: 0.2rem;
  line-height: 1.35;
}

.settings-group {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.settings-group:last-child {

}

.settings-label-row {

  justify-content: space-between;
  align-items: center;
}

.settings-item-title {
  font-weight: 600;
  font-size: 0.92rem;
  color: #fff;
}

.settings-item-desc {
  font-size: 0.8rem;
  color: var(--text-muted);
  line-height: 1.45;
  margin: 0;
}

.settings-badge {
  font-size: 0.75rem;
  padding: 0.2rem 0.6rem;
  border-radius: var(--radius-full);
  background: rgba(0, 240, 255, 0.12);
  color: var(--accent-cyan);
  border: 1px solid rgba(0, 240, 255, 0.3);

/* Debounce Latency Pills */

.debounce-pill {

  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.debounce-pill:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(0, 240, 255, 0.4);
  color: #fff;
}

.debounce-pill.active {
  background: rgba(0, 240, 255, 0.15);
  border-color: var(--accent-cyan);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
}

/* NKRO Status Badge */
.nkro-status-badge {
  display: inline-flex;
  align-items: center;
  font-size: 0.8rem;
  padding: 0.4rem 0.75rem;
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  margin-top: 0.25rem;
  transition: all var(--transition-fast);
}

.nkro-status-badge.active {
  background: rgba(16, 185, 129, 0.12);
  border-color: rgba(16, 185, 129, 0.4);
  color: #10b981;
  font-weight: 600;
}

/* Modern iOS / Cyber Switch Control */
.switch-control {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 24px;
  cursor: pointer;
}

.switch-control input {
  opacity: 0;
  width: 0;
  height: 0;
}

.switch-slider {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(255, 255, 255, 0.12);
  border: 1px solid var(--border-color);
  transition: var(--transition-fast);
  border-radius: 24px;
}

.switch-slider:before {
  position: absolute;
  content: "";
  height: 16px;
  width: 16px;
  left: 3px;
  bottom: 3px;
  background-color: #fff;
  transition: var(--transition-fast);
  border-radius: 50%;
}

input:checked + .switch-slider {

.flasher-console-header {

/* ==========================================================================
   Multi-Stop Gradient Ramp Editor Component
   ========================================================================== */
.gradient-editor-widget {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  margin-top: 0.75rem;
  margin-bottom: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
}

.gradient-track-wrap {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.gradient-track-label-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
}

.gradient-track-title {
  font-weight: 600;
  color: var(--text-main);
}

.gradient-track-hint {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.gradient-track-area {
  position: relative;
  height: 38px;
  border-radius: var(--radius-md);
  cursor: crosshair;
  user-select: none;
  touch-action: none;
  margin: 14px 0 8px 0;
}

.gradient-track-bar {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-md);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.3);
  transition: background 0.1s ease;
}

.gradient-pins-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.gradient-pin {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 22px;
  height: 34px;
  cursor: grab;
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 5;
  transition: transform 0.08s ease;
}

.gradient-pin:active,
.gradient-pin.dragging {
  cursor: grabbing;
}

.gradient-pin.active {
  z-index: 10;
}

.pin-marker {
  width: 18px;
  height: 26px;
  border-radius: 4px 4px 10px 10px;
  border: 2px solid #ffffff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.5);
  transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
}

.gradient-pin:hover .pin-marker {
  transform: scale(1.1);
  border-color: #ffffff;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
}

.gradient-pin.active .pin-marker {
  transform: scale(1.2);
  border-color: var(--accent-cyan);
  box-shadow: 0 0 14px var(--accent-cyan-glow), inset 0 0 4px rgba(0, 240, 255, 0.5);
}

.pin-tooltip {
  position: absolute;
  top: -24px;
  background: rgba(10, 14, 26, 0.9);
  color: #ffffff;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.15s ease, transform 0.15s ease;
  white-space: nowrap;
}

.gradient-pin:hover .pin-tooltip,
.gradient-pin.dragging .pin-tooltip {
  opacity: 1;
  transform: translateY(0);
}

.gradient-stop-controls-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 1.25rem;
  background: rgba(0, 0, 0, 0.25);
  padding: 0.85rem 1rem;
  border-radius: var(--radius-md);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.gradient-stop-controls-bar input:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.gradient-stop-control-item {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.gradient-stop-control-actions {
  display: flex;
  align-items: flex-end;
  gap: 0.5rem;
  margin-left: auto;
}

.gradient-presets-bar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  padding-top: 0.5rem;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.presets-bar-title {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
}

.gradient-preset-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.preset-pill {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text-main);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.15s ease;
}

.preset-pill:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: var(--accent-cyan);
  transform: translateY(-1px);
  color: #ffffff;
}

.preset-pill:active {
  transform: translateY(0);
}

  function getLayoutBounds(layout) {
    if (!layout || !Array.isArray(layout) || layout.length === 0) {
      return { width: 22.5, height: 6.25 };
    }
    let maxX = 0;
    let maxY = 0;
    layout.forEach(k => {
      const r = (Number(k.x) || 0) + (Number(k.w) || 1);
      const b = (Number(k.y) || 0) + (Number(k.h) || 1);
      if (r > maxX) maxX = r;
      if (b > maxY) maxY = b;
    });
    return { width: Math.max(maxX, 12), height: Math.max(maxY, 4) };
  }

  function getLayoutForProfile(profile) {
    if (!profile) return LAYOUT_100_ANSI;
    if (profile.customLayout && Array.isArray(profile.customLayout)) {

    }
    const form = (profile.formFactor || "100%").replace("%", "").toLowerCase();

    return LAYOUT_REGISTRY[key] || LAYOUT_REGISTRY[`${form}-ansi`] || LAYOUT_100_ANSI;

    // 1. Direct QMK info.json format: viaJson.layouts[NAME].layout
    if (viaJson.layouts) {
      const names = Object.keys(viaJson.layouts);
      if (names.length > 0) {
        const layoutObj = viaJson.layouts.LAYOUT || viaJson.layouts[names[0]];
        if (layoutObj && Array.isArray(layoutObj.layout)) {
          return layoutObj.layout.map((k, idx) => {
            const rawLabel = k.label || "";
            const isKnob = rawLabel.toLowerCase().includes("knob");
            const isLogo = rawLabel.toLowerCase().includes("logo");
            const id = isKnob ? "KNOB_PRESS" : (isLogo ? "LOGO_LED" : (rawLabel.toUpperCase().replace(/[^A-Z0-9]/g, "") || `K_${idx}`));
            return {
              id: id,
              label: rawLabel || id,
              matrix: k.matrix || [Math.floor(idx / 8), idx % 8],
              x: Number(k.x) || 0,
              y: Number(k.y) || 0,
              w: Number(k.w) || 1,
              h: Number(k.h) || 1,
              group: isKnob ? "knob" : (isLogo ? "logo" : determineKeyGroup(id, rawLabel, k.x, k.y, k.w)),
              isKnob: isKnob,
              isLogo: isLogo,
              defaultKeycode: 0x0000
            };
          });
        }

        // 2. VIA KLE matrix format: viaJson.layouts.keymap = [ [ ... ] ]
        if (layoutObj && Array.isArray(layoutObj.keymap)) {
          return parseKLEKeymap(layoutObj.keymap);
        }
      }
    }

    // 3. Fallback: viaJson.keymap or direct array
    if (Array.isArray(viaJson.keymap)) {
      return parseKLEKeymap(viaJson.keymap);
    }

    return null;
  }

  function parseKLEKeymap(rows) {
    const keys = [];
    let curY = 0;
    let keyIdx = 0;

    rows.forEach(row => {
      if (!Array.isArray(row)) return;
      let curX = 0;
      let curW = 1;
      let curH = 1;

      row.forEach(item => {
        if (typeof item === "object") {
          if (item.x !== undefined) curX += Number(item.x);
          if (item.y !== undefined) curY += Number(item.y);
          if (item.w !== undefined) curW = Number(item.w);
          if (item.h !== undefined) curH = Number(item.h);
        } else if (typeof item === "string") {
          // KLE string format: "0,0\n\n\n\n\n\nEsc"
          const parts = item.split("\n");
          let matrix = [0, 0];
          let label = parts[0];

          if (parts.length >= 2 && parts[0].includes(",")) {
            const matCoords = parts[0].split(",");
            matrix = [parseInt(matCoords[0], 10) || 0, parseInt(matCoords[1], 10) || 0];
            label = parts[parts.length - 1] || parts[0];
          }

          const isKnob = label.toLowerCase().includes("knob");
          const isLogo = label.toLowerCase().includes("logo");
          const id = isKnob ? "KNOB_PRESS" : (isLogo ? "LOGO_LED" : (label.toUpperCase().replace(/[^A-Z0-9]/g, "") || `K_${keyIdx}`));

          keys.push({
            id: id,
            label: label,
            matrix: matrix,
            x: curX,
            y: curY,
            w: curW,
            h: curH,
            group: isKnob ? "knob" : (isLogo ? "logo" : determineKeyGroup(id, label, curX, curY, curW)),
            isKnob: isKnob,
            isLogo: isLogo,
            defaultKeycode: 0x0000
          });

          curX += curW;
          curW = 1;
          curH = 1;
          keyIdx++;
        }
      });
      curY += 1;
    });

    return keys.length > 0 ? keys : null;
  }

/**
 * LuxQMK Studio - Device Manager & Adaptive Capability Engine
 */
(function () {
  const STUDIO_VERSION = "1.4.0";
  const REQUIRED_FW_VERSION = { major: 0, minor: 3, patch: 1 };

  class DeviceManager {
    constructor() {
      this.registry = [];
      this.activeProfile = null;
      this.firmwareInfo = null;
      this.initRegistry();
    }

    initRegistry() {
      if (window.GMMK3_DEVICES) this.registry.push(...window.GMMK3_DEVICES);
      if (window.GMMK2_DEVICES) this.registry.push(...window.GMMK2_DEVICES);
      if (window.GENERIC_VIA_DEVICES) this.registry.push(...window.GENERIC_VIA_DEVICES);

      // Default active profile: GMMK 3 100% ANSI
      this.activeProfile = this.registry.find(function(d) { return d.id === 'gmmk3-100-ansi'; }) || this.registry[0];
    }

    getAllProfiles() {
      return this.registry;
    }

    getActiveProfile() {
      return this.activeProfile;
    }

    hasCapability(capName) {
      if (this.firmwareInfo && this.firmwareInfo.capabilities && this.firmwareInfo.capabilities[capName] !== undefined) {
        return !!this.firmwareInfo.capabilities[capName];
      }
      return !!(this.activeProfile && this.activeProfile.capabilities && this.activeProfile.capabilities[capName]);
    }

    identifyAndApply(device) {
      this.activeDevice = device || null;
      if (!device) return this.activeProfile;

      const vid = device.vendorId;
      const pid = device.productId;
      const name = (device.productName || '').toLowerCase();

      let matched = this.registry.find(function(p) { return p.vendorId === vid && p.productId === pid; });
      if (!matched) {
        if (name.includes('gmmk 3') || name.includes('gmmk3')) {
          if (name.includes('75')) matched = this.registry.find(function(p) { return p.id === 'gmmk3-75-ansi'; });
          else if (name.includes('65')) matched = this.registry.find(function(p) { return p.id === 'gmmk3-65-ansi'; });
          else matched = this.registry.find(function(p) { return p.id === 'gmmk3-100-ansi'; });
        } else if (name.includes('gmmk 2') || name.includes('gmmk2')) {
          if (name.includes('65')) matched = this.registry.find(function(p) { return p.id === 'gmmk2-65-ansi'; });
          else matched = this.registry.find(function(p) { return p.id === 'gmmk2-96-ansi'; });
        }
      }

      if (!matched) {
        matched = this.registry.find(function(p) { return p.id === 'generic-via'; }) || this.registry[0];
      }

      this.activeProfile = matched;
      this.applyProfileUI();
      this.refreshAllCanvases();
      return matched;
    }

    setProfile(profileId) {
      const p = this.registry.find(item => item.id === profileId);
      if (p) {
        this.activeProfile = p;
        this.applyProfileUI();
        this.refreshAllCanvases();
      }
    }

    loadCustomVIALayout(viaJson) {
      if (!window.LayoutEngine) return false;
      const keys = window.LayoutEngine.parseVIALayout(viaJson);
      if (keys && keys.length > 0) {
        if (!this.activeProfile) {
          this.activeProfile = Object.assign({}, this.registry[0]);
        }
        this.activeProfile.customLayout = keys;
        this.applyProfileUI();
        this.refreshAllCanvases();
        return true;
      }
      return false;
    }

    refreshAllCanvases() {
      if (window.gKeymapEditor) window.gKeymapEditor.renderKeyboard();
      if (window.gLighting) window.gLighting.renderVisualizerCanvas();
      if (window.gKeyTester) window.gKeyTester.renderTesterCanvas();
      if (window.gUI && typeof window.gUI.fitKeyboardPreviews === 'function') {
        window.gUI.fitKeyboardPreviews();
      }
    }

    setFirmwareInfo(info) {
      this.firmwareInfo = info;
      this.applyProfileUI();
    }

    getLightingType() {
      if (this.firmwareInfo && this.firmwareInfo.capabilities) {
        if (this.firmwareInfo.capabilities.hasRgbMatrix) return 'rgb_matrix';
        if (this.firmwareInfo.capabilities.hasMonochromeBacklight) return 'monochrome';
        if (this.firmwareInfo.capabilities.hasLighting === false) return 'none';
      }
      if (this.activeProfile) {
        if (this.activeProfile.lightingType) return this.activeProfile.lightingType;
        if (this.activeProfile.capabilities) {
          if (this.activeProfile.capabilities.hasRgbMatrix) return 'rgb_matrix';
          if (this.activeProfile.capabilities.hasMonochromeBacklight) return 'monochrome';
          if (this.activeProfile.capabilities.hasLighting === false) return 'none';
        }
      }
      return 'rgb_matrix';
    }

    applyProfileUI() {
      const profile = this.activeProfile;
      if (!profile) return;
      const lightingType = this.getLightingType();
      const i18n = window.i18n;

      // 1. Update Hardware Info Card in Settings Tab
      const hwModel = document.getElementById('hw-keyboard-model');
      const realName = (this.activeDevice && this.activeDevice.productName) ? this.activeDevice.productName : profile.name;
      if (hwModel) hwModel.textContent = realName;

      const hwMcu = document.getElementById('hw-mcu-chip');
      if (hwMcu) hwMcu.textContent = profile.mcu;

      const hwVidPid = document.getElementById('hw-usb-vidpid');
      const liveVid = this.activeDevice ? this.activeDevice.vendorId : profile.vendorId;
      const livePid = this.activeDevice ? this.activeDevice.productId : profile.productId;
      if (hwVidPid) {
        hwVidPid.textContent = (liveVid !== null && liveVid !== undefined && livePid !== null && livePid !== undefined)
          ? 'VID: 0x' + liveVid.toString(16).toUpperCase().padStart(4, '0') + ' | PID: 0x' + livePid.toString(16).toUpperCase().padStart(4, '0')
          : 'Generic USB HID';
      }

      const hwMatrix = document.getElementById('hw-matrix-layout');
      if (hwMatrix) hwMatrix.textContent = profile.matrix;

      const hwEeprom = document.getElementById('hw-eeprom-size');
      if (hwEeprom) {
        if (this.firmwareInfo && (this.firmwareInfo.major > 0 || this.firmwareInfo.minor > 2 || (this.firmwareInfo.minor === 2 && this.firmwareInfo.patch >= 1))) {
          hwEeprom.textContent = window.i18n ? window.i18n.t('valEepromSize1408') : '1408 Bytes Dedicated Storage (Per-Key RGB Profiles)';
        } else if (this.firmwareInfo && (this.firmwareInfo.major > 0 || this.firmwareInfo.minor >= 2)) {
          hwEeprom.textContent = window.i18n ? window.i18n.t('valEepromSize104') : '104 Bytes Dedicated Storage';
        } else if (this.firmwareInfo) {
          hwEeprom.textContent = window.i18n ? window.i18n.t('valEepromSize36') : '36 Bytes Dedicated Storage (Legacy)';
        } else {
          hwEeprom.textContent = window.i18n ? window.i18n.t('valEepromSizeDefault') : '1408 Bytes Dedicated Storage (Per-Key RGB Profiles)';
        }
      }

      // Update Firmware & Engine information
      const hwProto = document.getElementById('hw-protocol-version');
      const hwCompat = document.getElementById('hw-compat-status');

      if (hwProto) {
        if (this.firmwareInfo && this.firmwareInfo.versionString && this.firmwareInfo.major !== undefined && (this.firmwareInfo.major > 0 || this.firmwareInfo.minor > 0 || this.firmwareInfo.patch > 0)) {
          const qmkStr = this.firmwareInfo.qmkVersion || 'QMK';
          const cleanVer = this.firmwareInfo.versionString.replace(/^v+/i, '');
          hwProto.textContent = `LuxQMK v${cleanVer} (${qmkStr} / VIA v12)`;
        } else if (this.firmwareInfo) {
          hwProto.textContent = window.i18n ? window.i18n.t('statusFwLegacy') : 'Legacy VIA / QMK (Unknown LuxQMK version)';
        } else {
          hwProto.textContent = window.i18n ? window.i18n.t('valProtocolVersionNone') : '— (Waiting for USB connection)';
        }
      }

      if (hwCompat) {
        if (!this.firmwareInfo) {
          hwCompat.textContent = i18n ? i18n.t('statusFwNotConnected') : '— (Waiting for device)';
          hwCompat.style.color = 'var(--text-muted, #888888)';
        } else if (this.firmwareInfo.major === 0 && this.firmwareInfo.minor === 0 && this.firmwareInfo.patch === 0) {
          hwCompat.textContent = i18n ? i18n.t('statusFwLegacy') : 'Legacy Firmware / Unknown Version';
          hwCompat.style.color = 'var(--accent-amber, #ffaa00)';
        } else {
          const fw = this.firmwareInfo;
          const isOlderThanRequired = fw.major < REQUIRED_FW_VERSION.major ||
            (fw.major === REQUIRED_FW_VERSION.major && (fw.minor < REQUIRED_FW_VERSION.minor ||
            (fw.minor === REQUIRED_FW_VERSION.minor && fw.patch < REQUIRED_FW_VERSION.patch)));

          if (isOlderThanRequired) {
            const detectedStr = `(v${fw.major}.${fw.minor}.${fw.patch})`;
            const reqStr = `v${REQUIRED_FW_VERSION.major}.${REQUIRED_FW_VERSION.minor}.${REQUIRED_FW_VERSION.patch}+`;
            hwCompat.textContent = i18n ? `${i18n.t('statusFwUpdateRequired', { reqVersion: reqStr })} ${detectedStr}` : `Firmware Update Recommended (LuxQMK ${reqStr}) ${detectedStr}`;
            hwCompat.style.color = 'var(--accent-amber, #ffaa00)';
          } else if (fw.major > REQUIRED_FW_VERSION.major || (fw.major === REQUIRED_FW_VERSION.major && fw.minor > REQUIRED_FW_VERSION.minor)) {
            hwCompat.textContent = i18n ? i18n.t('statusFwNewer') : 'Newer Firmware Detected (Update Studio)';
            hwCompat.style.color = 'var(--accent-cyan, #00e5ff)';
          } else {
            hwCompat.textContent = i18n ? i18n.t('statusFwCompatible', { version: STUDIO_VERSION }) : `Fully Compatible (LuxQMK Studio v${STUDIO_VERSION})`;
            hwCompat.style.color = 'var(--accent-green, #00ff88)';
          }
        }
      }

      // 2. Adapt Rotary Encoder UI visibility (Sidebar & Canvas)
      const encoderNavBtn = document.querySelector('.nav-item-btn[data-view="encoder"]');
      const encoderSection = document.getElementById('encoder-controls');
      const knobElement = document.querySelector('.rotary-knob');
      const hasEncoder = !!(profile.capabilities && profile.capabilities.hasRotaryEncoder);
      if (encoderNavBtn) {
        encoderNavBtn.style.display = hasEncoder ? 'flex' : 'none';
      }
      if (encoderSection) {
        encoderSection.style.display = hasEncoder ? 'block' : 'none';
      }
      if (knobElement) {
        knobElement.style.display = hasEncoder ? 'flex' : 'none';
      }

      // 3. Adapt Lighting Navigation & Views according to Hardware Lighting Tier
      const lightingNavBtn = document.querySelector('.nav-item-btn[data-view="lighting"]');
      const studioLightingNavBtn = document.querySelector('.nav-item-btn[data-view="studio_lighting"]');

      if (lightingNavBtn) {
        if (lightingType === 'none') {
          lightingNavBtn.style.display = 'none';
        } else {
          lightingNavBtn.style.display = 'flex';
          const navLabel = lightingNavBtn.querySelector('span[data-i18n]') || lightingNavBtn.querySelector('span:not(.nav-icon)');
          if (navLabel) {
            if (lightingType === 'monochrome') {
              navLabel.textContent = i18n ? i18n.t('navBacklight') : 'Backlight';
              navLabel.setAttribute('data-i18n', 'navBacklight');
            } else {
              navLabel.textContent = i18n ? i18n.t('navLighting') : 'QMK Lighting';
              navLabel.setAttribute('data-i18n', 'navLighting');
            }
          }
        }
      }

      if (studioLightingNavBtn) {
        studioLightingNavBtn.style.display = (lightingType === 'rgb_matrix') ? 'flex' : 'none';
      }

      // View fallback if current view became hidden
      if (window.gUI && typeof window.gUI.switchView === 'function') {
        const cur = window.gUI.currentView;
        if (lightingType === 'none' && (cur === 'lighting' || cur === 'studio_lighting')) {
          window.gUI.switchView('keymap');
        } else if (lightingType === 'monochrome' && cur === 'studio_lighting') {
          window.gUI.switchView('lighting');
        }
      }

      // Adapt Keymap Editor category tabs
      const lightingCatBtn = document.querySelector('.cat-tab-btn[data-category="lighting"]');
      const customCatBtn = document.querySelector('.cat-tab-btn[data-category="custom"]');

      if (lightingCatBtn) {
        if (lightingType === 'none') {
          lightingCatBtn.style.display = 'none';
        } else {
          lightingCatBtn.style.display = 'inline-flex';
          if (lightingType === 'monochrome') {
            lightingCatBtn.textContent = i18n ? i18n.t('catBacklight') : 'Backlight';
            lightingCatBtn.setAttribute('data-i18n', 'catBacklight');
          } else {
            lightingCatBtn.textContent = i18n ? i18n.t('catLighting') : 'Lighting';
            lightingCatBtn.setAttribute('data-i18n', 'catLighting');
          }
        }
      }

      if (customCatBtn) {
        customCatBtn.style.display = (lightingType === 'none') ? 'none' : 'inline-flex';
      }

      // If active category was hidden, reset to basic
      if (window.gKeymapEditor && (lightingType === 'none' && (window.gKeymapEditor.selectedCategory === 'lighting' || window.gKeymapEditor.selectedCategory === 'custom'))) {
        window.gKeymapEditor.selectedCategory = 'basic';
        document.querySelectorAll('.cat-tab-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.category === 'basic');
        });
        window.gKeymapEditor.renderKeycodePicker();
      } else if (window.gKeymapEditor) {
        window.gKeymapEditor.renderKeycodePicker();
      }

      // Adapt Lighting Sub-Tabs & Cards in view-lighting
      const lightingTabsHeader = document.querySelector('.lighting-tabs-header');
      const rgbSubviews = document.querySelectorAll('.lighting-subview:not(#card-monochrome-backlight)');
      const monochromeCard = document.getElementById('card-monochrome-backlight');

      if (lightingType === 'monochrome') {
        if (lightingTabsHeader) lightingTabsHeader.style.display = 'none';
        rgbSubviews.forEach(sv => sv.style.display = 'none');
        if (monochromeCard) monochromeCard.style.display = 'block';
      } else if (lightingType === 'rgb_matrix') {
        if (lightingTabsHeader) lightingTabsHeader.style.display = 'flex';
        if (monochromeCard) monochromeCard.style.display = 'none';
        // restore active subview
        const activeTab = (window.gLighting && window.gLighting.activeTab) ? window.gLighting.activeTab : 'backlight';
        const activeSubView = document.getElementById(`lighting-tab-${activeTab}`);
        if (activeSubView) activeSubView.style.display = 'block';
      } else {
        if (lightingTabsHeader) lightingTabsHeader.style.display = 'none';
        rgbSubviews.forEach(sv => sv.style.display = 'none');
        if (monochromeCard) monochromeCard.style.display = 'none';
      }

      // 4. Adapt Logo Badge LED UI visibility (Lighting Sub-Tab & Cards)
      const logoTabBtn = document.querySelector('.lighting-tab-btn[data-tab="logo"]');
      const logoCard = document.getElementById('card-logo-led');
      const hasLogo = this.hasCapability('hasLogoBadgeLed') || !!(profile.capabilities && profile.capabilities.hasLogoBadgeLed);
      if (logoTabBtn) {
        logoTabBtn.style.display = (lightingType === 'rgb_matrix' && hasLogo) ? 'inline-flex' : 'none';
      }
      if (logoCard) {
        logoCard.style.display = (lightingType === 'rgb_matrix' && hasLogo) ? 'block' : 'none';
      }

      // 4b. Adapt Sidelights Controls UI visibility (Main Backlight & Studio Lighting)
      const sidelightWrap = document.getElementById('sidelightCustomEnableWrap');
      const studioSidelightWrap = document.getElementById('studioSidelightCard');
      const hasSidelights = this.hasCapability('hasSidelights') || this.hasCapability('sidelights') || !!(profile.capabilities && profile.capabilities.hasSidelights);
      if (sidelightWrap) {
        sidelightWrap.style.display = (lightingType === 'rgb_matrix' && hasSidelights) ? 'flex' : 'none';
      }
      if (studioSidelightWrap) {
        studioSidelightWrap.style.display = (lightingType === 'rgb_matrix' && hasSidelights) ? 'block' : 'none';
      }

      // 5. Update Header Device Label & Layout Preset Selector
      const deviceTitle = document.getElementById('device-title');
      if (deviceTitle) {
        deviceTitle.textContent = profile.name;
      }

      const layoutPresetSelect = document.getElementById('layoutPresetSelect');
      if (layoutPresetSelect && profile.id) {
        layoutPresetSelect.value = profile.id;
      }

      // 6. Update Connected Device Badge in Keymap Toolbar
      const badgeName = document.getElementById('connectedDeviceBadgeName');
      const badgeVidPid = document.getElementById('connectedDeviceBadgeVidPid');
      const badgeProto = document.getElementById('connectedDeviceBadgeProto');

      if (badgeName) {
        badgeName.textContent = realName;
      }
      if (badgeVidPid) {
        badgeVidPid.textContent = (liveVid !== null && liveVid !== undefined && livePid !== null && livePid !== undefined)
          ? 'VID: 0x' + liveVid.toString(16).toUpperCase().padStart(4, '0') + ' | PID: 0x' + livePid.toString(16).toUpperCase().padStart(4, '0')
          : 'USB HID';
      }
      if (badgeProto) {
        if (this.firmwareInfo && this.firmwareInfo.versionString && (this.firmwareInfo.major > 0 || this.firmwareInfo.minor > 0 || this.firmwareInfo.patch > 0)) {
          const cleanVer = this.firmwareInfo.versionString.replace(/^v+/i, '');
          badgeProto.textContent = `LuxQMK v${cleanVer}`;
        } else {
          badgeProto.textContent = 'LuxQMK / VIA';
        }
      }
    }
  }

  DeviceManager.STUDIO_VERSION = STUDIO_VERSION;
  DeviceManager.REQUIRED_FW_VERSION = REQUIRED_FW_VERSION;
  window.STUDIO_VERSION = STUDIO_VERSION;
  window.DeviceManager = DeviceManager;
  window.deviceManager = new DeviceManager();
})();

/**

(function () {

  // Quick lookup dictionary by 16-bit keycode
  const CODE_MAP = new Map();
  KEYCODES_DB.forEach(k => {
    if (k.code >= 0) CODE_MAP.set(k.code, k);
  });

  function getKeycodeInfo(code) {
    if (code === undefined || code === null) return { code: 0, label: "None", name: "KC_NO" };
    
    // Check known dictionary
    if (CODE_MAP.has(code)) {
      return CODE_MAP.get(code);
    }

    // LuxQMK / VIA User Keycodes (QK_USER_0..31: 0x7E40..0x7E5F) -> Alias to QK_KB_0..31
    if (code >= 0x7E40 && code <= 0x7E5F) {
      const aliasCode = 0x7E00 + (code - 0x7E40);
      if (CODE_MAP.has(aliasCode)) {
        return CODE_MAP.get(aliasCode);
      }
      const userIdx = code - 0x7E40;
      return { code, label: `USER(${userIdx})`, name: `USER_${userIdx}`, category: "custom" };
    }

    // Generic Custom Keycodes (QK_KB_0..31: 0x7E00..0x7E1F)
    if (code >= 0x7E00 && code <= 0x7E1F) {
      const customIdx = code - 0x7E00;
      return { code, label: `CUSTOM(${customIdx})`, name: `CUSTOM_${customIdx}`, category: "custom" };
    }

    // Dynamic Layer Tap: LT(layer, kc) -> 0x4000 .. 0x4FFF (bits: 0100 llll kkkkkkkk)
    if ((code & 0xF000) === 0x4000) {
      const layer = (code >> 8) & 0x0F;
      const baseKc = code & 0xFF;
      const baseInfo = CODE_MAP.get(baseKc) || { label: `0x${baseKc.toString(16).toUpperCase()}` };
      return {
        code,
        label: `${baseInfo.label} Fn${layer}`,
        name: `LT(${layer}, ${baseInfo.name || baseInfo.label})`,
        category: "layers"
      };
    }

    // Dynamic layer decoding (MO, TO, TG, TT, OSL, DF, LM)
    const topByte = (code >> 8) & 0xFF;
    const layer = code & 0x1F;
    if (topByte === 0x52) {
      const type = (code >> 5) & 0x07;
      if (type === 0) return { code, label: `TO(${layer})`, name: `TO(${layer})`, category: "layers" };
      if (type === 1) return { code, label: `MO(${layer})`, name: `MO(${layer})`, category: "layers" };
      if (type === 2) return { code, label: `DF(${layer})`, name: `DF(${layer})`, category: "layers" };
      if (type === 3) return { code, label: `TG(${layer})`, name: `TG(${layer})`, category: "layers" };
      if (type === 4) return { code, label: `OSL(${layer})`, name: `OSL(${layer})`, category: "layers" };
      if (type === 5) {
        const mod = (code >> 5) & 0x1F;
        return { code, label: `LM(${layer})`, name: `LM(${layer},${mod})`, category: "layers" };
      }
      if (type === 6) return { code, label: `TT(${layer})`, name: `TT(${layer})`, category: "layers" };
    }

    // Dynamic macro decoding (M0 - M15)
    if (topByte === 0x77) {
      const macroId = code & 0x0F;
      return { code, label: `M${macroId}`, name: `M${macroId}`, category: "macro" };
    }

    // Dynamic Modified Keycodes (LSFT, LCTL, LALT, LGUI combos)
    if ((code & 0x0200) === 0x0200 && (code & 0xFF00) === 0x0200) {
      const baseKc = code & 0xFF;
      const baseInfo = CODE_MAP.get(baseKc);
      if (baseInfo) {
        return { code, label: `S(${baseInfo.label})`, name: `LSFT(${baseInfo.name})`, category: "special" };
      }
    }

    if (code === 0x0001) return { code: 0x0001, label: "▽ (Pass)", name: "KC_TRNS", category: "special" };
    if (code === 0x0000) return { code: 0x0000, label: "None", name: "KC_NO", category: "special" };

    return {
      code: code,
      label: `0x${code.toString(16).toUpperCase().padStart(4, "0")}`,
      name: `0x${code.toString(16).toUpperCase().padStart(4, "0")}`,
      category: "special"
    };
  }

  function getShortKeycodeLabel(info) {
    if (!info) return '';
    const name = info.name || '';
    const label = info.label || '';

    switch (name) {
      case 'KC_PSCR': return 'PrtSc';
      case 'KC_SCRL': return 'ScrLk';
      case 'KC_PAUS': return 'Pause';
      case 'KC_INS': return 'Ins';
      case 'KC_DEL': return 'Del';
      case 'KC_HOME': return 'Home';
      case 'KC_END': return 'End';
      case 'KC_PGUP': return 'PgUp';
      case 'KC_PGDN': return 'PgDn';
      case 'KC_ESC': return 'Esc';
      case 'KC_BSPC': return 'Bksp';
      case 'KC_CAPS': return 'Caps';
      case 'KC_TAB': return 'Tab';
      case 'KC_ENT': return 'Enter';
      case 'KC_SPC': return 'Space';
      case 'KC_APP': return 'Menu';
      case 'KC_LCTL': return 'L-Ctrl';
      case 'KC_RCTL': return 'R-Ctrl';
      case 'KC_LSFT': return 'L-Shift';
      case 'KC_RSFT': return 'R-Shift';
      case 'KC_LALT': return 'L-Alt';
      case 'KC_RALT': return 'R-Alt';
      case 'KC_LGUI': return 'L-Win';
      case 'KC_RGUI': return 'R-Win';
      case 'KC_NUM': return 'Num';
      case 'KC_PSLS': return '/';
      case 'KC_PAST': return '*';

  class I18n {
    constructor() {
      this.listeners = [];
      // English is the foundational default
      this.currentLang = localStorage.getItem("gmmk_studio_lang") || "en";
    }

    t(key, params = {}) {
      const dict = translations[this.currentLang] || translations.en;
      let text = dict[key] || translations.en[key] || key;
      if (typeof text === "string" && params) {
        Object.keys(params).forEach(k => {
          text = text.replace(new RegExp(`\\{${k}\\}`, "g"), params[k]);
        });
      }
      return text;
    }

    onChange(fn) {
      if (typeof fn === "function") {
        this.listeners.push(fn);
      }
    }

    setLang(lang) {
      if (translations[lang]) {
        this.currentLang = lang;
        localStorage.setItem("gmmk_studio_lang", lang);
        document.documentElement.lang = lang;
        this.translatePage();
        this.listeners.forEach(fn => {
          try { fn(lang); } catch (e) { console.warn("i18n listener error:", e); }
        });
      }
    }

    translatePage() {
      // 1. Standard text content & HTML formatting
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.dataset.i18n;
        const translation = this.t(key);
        if (translation) {
          if (el.tagName === "INPUT" && el.type === "placeholder") {
            el.placeholder = translation;
          } else if (/<[a-z][\s\S]*>/i.test(translation)) {
            el.innerHTML = translation;
          } else {
            el.textContent = translation;
          }
        }
      });

      // 2. Tooltip / Title attributes
      document.querySelectorAll("[data-i18n-title]").forEach((el) => {
        const key = el.dataset.i18nTitle;
        const translation = this.t(key);
        if (translation) el.title = translation;
      });

      // 3. Placeholder attributes
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        const key = el.dataset.i18nPlaceholder;
        const translation = this.t(key);
        if (translation) el.placeholder = translation;
      });

      // 4. Optgroup & element labels
      document.querySelectorAll("[data-i18n-label]").forEach((el) => {
        const key = el.dataset.i18nLabel;
        const translation = this.t(key);
        if (translation) el.label = translation;
      });
    }
  }

  window.i18n = new I18n();
})();
