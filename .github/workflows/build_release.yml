name: Build & Release LuxQMK Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'
      is_draft:
        description: 'Publish as draft?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile and Build NSIS Installer
        run: npm run dist:installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package & Prepare Release Artifacts
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.release_tag }}" -ne "") { "${{ github.event.inputs.release_tag }}" } else { "${{ github.ref_name }}" }
          $cleanVersion = $tag.TrimStart("v")
          
          Write-Host "[+] Preparing release binaries for tag: $tag ($cleanVersion)"
          
          # Locate built NSIS executable
          $builtExe = Get-ChildItem -Path "release" -Filter "LuxQMK Studio Setup *.exe" | Select-Object -First 1
          if (-not $builtExe) {
            Write-Error "[-] Could not find built installer in release/ folder!"
            exit 1
          }

          # Create standardized filename copies
          $versionedName = "LuxQMK-Studio-Setup-$cleanVersion.exe"
          $genericName = "LuxQMK-Studio-Setup.exe"

          Copy-Item $builtExe.FullName -Destination "release\$versionedName" -Force
          Copy-Item $builtExe.FullName -Destination "release\$genericName" -Force

          # Calculate SHA-256 Checksums
          $hashVersioned = (Get-FileHash -Path "release\$versionedName" -Algorithm SHA256).Hash.ToLower()
          $hashGeneric = (Get-FileHash -Path "release\$genericName" -Algorithm SHA256).Hash.ToLower()

          $checksumsContent = @"
          $hashVersioned  $versionedName
          $hashGeneric  $genericName
          "@.Trim()

          Set-Content -Path "release\SHA256SUMS.txt" -Value $checksumsContent -Encoding utf8

          Write-Host "[+] SHA-256 Checksum ($versionedName): $hashVersioned"
          Get-ChildItem -Path "release"

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: LuxQMK Studio ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: ${{ github.event.inputs.is_draft == 'true' || false }}
          prerelease: false
          generate_release_notes: true
          files: |
            release/LuxQMK-Studio-Setup-*.exe
            release/LuxQMK-Studio-Setup.exe
            release/SHA256SUMS.txt
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
