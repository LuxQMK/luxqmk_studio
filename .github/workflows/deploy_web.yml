name: Deploy LuxQMK Studio Web to Cloudflare Pages

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    name: Build and Deploy Studio Web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App bundle (Vite)
        run: npm run build

      - name: Deploy to Cloudflare Pages (Direct Upload via Wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=luxqmk-studio --branch="${{ github.ref_name }}" --commit-dirty=true
